schema:
  schema_id: urn:omos:schema:ai-work-record-loop:0.1.0
  version: 0.1.0
  status: DRAFT_REVIEW_REQUIRED
  date: '2026-09-09'
  traces_to:
    - AIWR-05
  builds_on:
    - 規格/v0.1/ai-task-card-record.yaml#fields
    - 規格/v0.1/ai-work-record-skill.yaml#output_contract

purpose:
  statement: >-
    A close-out Loop contract: at task end, inspect the work-record draft for
    missing required fields and open items, and fill only the necessary
    evidence / status in bounded iterations. The Loop has an explicit
    termination (max iterations + timeout + a fixed terminal-condition set), it
    never widens task scope, it stops and marks a blocker when a gap needs a
    human decision, and it fails loud while preserving the original evidence
    when a gap cannot be fixed. The Loop does not re-define the SSP-298
    boundary, the SSP-299 card format or the SSP-300 Skill I/O — it references
    them.
  no_second_workflow_authority: true

termination:
  max_iterations_rule: positive integer
  timeout_seconds_rule: positive integer
  elapsed_seconds_rule: non-negative integer, measured wall-clock run time
  terminal_conditions:
    - ALL_REQUIRED_PRESENT
    - MAX_ITERATIONS_REACHED
    - TIMEOUT
    - BLOCKER_MARKED
    - UNFIXABLE
  unbounded_rule: >-
    a Loop run without a positive max_iterations, without a positive
    timeout_seconds, or without a verifiable non-negative elapsed_seconds is
    LOOP_UNBOUNDED.
  timeout_enforcement_rule: >-
    elapsed_seconds must be compared against timeout_seconds. If
    elapsed_seconds > timeout_seconds the run may only pass when it ended with
    outcome FAILED_LOUD and terminal_condition TIMEOUT; otherwise it is
    LOOP_OVER_TIMEOUT. timeout is enforcement, not metadata.
  timeout_reached_rule: >-
    the reverse direction of the same rule: a run whose terminal_condition is
    TIMEOUT must actually have exceeded its budget, i.e. elapsed_seconds must be
    strictly greater than timeout_seconds. Equality is not a timeout. A run that
    claims TIMEOUT without exceeding the budget is LOOP_TIMEOUT_NOT_REACHED, so a
    caller cannot label an ordinary stop as a timeout.

scope_lock:
  fillable_fields:
    - status
    - evidence_refs
  forbidden_fill_fields:
    - card_id
    - objective
    - scope
    - constraints
    - acceptance
  rule: >-
    every filled field in every iteration must be one of fillable_fields; any
    other field (a scope-defining field or an unknown field) is
    LOOP_SCOPE_EXPANSION.

human_decision_gate:
  gap_flag: requires_human_decision
  rule: >-
    if any remaining gap has requires_human_decision true, the run must end with
    outcome BLOCKED and a blocker_ref; continuing to fill is
    LOOP_SKIPPED_HUMAN_DECISION.

unfixable:
  gap_flag: auto_fixable
  rule: >-
    a remaining gap with auto_fixable false that is not a human-decision gap
    forces outcome FAILED_LOUD with original_evidence_preserved true; a silent
    drop is LOOP_UNFIXABLE_NOT_LOUD and dropping the original evidence is
    LOOP_EVIDENCE_NOT_PRESERVED.

run_record:
  run_time_field: elapsed_seconds
  iteration_fields:
    - iteration
    - filled_fields
    - remaining_gaps
  iteration_shape_rule: >-
    every iteration is a mapping carrying all of iteration_fields; filled_fields
    and remaining_gaps are arrays. A missing field is LOOP_MALFORMED_ITERATION,
    fail-closed (a missing remaining_gaps is never read as "no gaps").
  mandatory_stop_rule: >-
    remaining_gaps is checked on every iteration, not only the last. The first
    iteration whose remaining_gaps contains a requires_human_decision gap must
    be the last iteration with outcome BLOCKED and a blocker_ref
    (LOOP_SKIPPED_HUMAN_DECISION otherwise); the first iteration whose
    remaining_gaps contains a non-human auto_fixable:false gap must be the last
    iteration with outcome FAILED_LOUD (LOOP_UNFIXABLE_NOT_LOUD otherwise).
  outcomes:
    - CLOSED
    - BLOCKED
    - FAILED_LOUD
  outcome_condition_map:
    CLOSED:
      - ALL_REQUIRED_PRESENT
      - MAX_ITERATIONS_REACHED
    BLOCKED:
      - BLOCKER_MARKED
    FAILED_LOUD:
      - TIMEOUT
      - UNFIXABLE
  required_present_rule: >-
    ALL_REQUIRED_PRESENT means the run actually closed everything out: the last
    iteration's remaining_gaps must be empty (LOOP_REQUIRED_PRESENT_WITH_GAPS
    otherwise). MAX_ITERATIONS_REACHED deliberately keeps the weaker meaning --
    the budget ran out and ordinary auto-fixable gaps may be handed to a human --
    so CLOSED stays valid there. Gaps that require a human decision or that are
    unfixable are still governed by the stricter mandatory-stop rules above and
    report their own codes.
  rule: >-
    iterations length must be <= max_iterations; outcome must be one of outcomes
    and its terminal_condition must be in outcome_condition_map[outcome].

authority:
  performs_memory_acceptance: false
  writes_company_knowledge: false
  error_behavior: FAIL_LOUD
  forbidden_run_fields:
    - personal_acceptance_ref
    - verification_receipt_ref
    - accepted_for_record
    - canonical_write_receipt_ref

error_contract_binding:
  rule: >-
    這些 key 必須逐字等於 evaluator 實際可回傳的 code 集合,由掃描 loop_closeout_failure
    函式本體的 return literal 求得。兩張手寫清單互比證明不了 evaluator:TIGHTEN-F-01 就是
    這樣讓一個未宣告的 LOOP_MISSING_FIELD 穿過完整 gate 的。
  evaluator_return_form_rule: >-
    掃描是 regex,必然語法特定,所以 evaluator 的 return 形式本身也被鎖住:
    loop_closeout_failure 內每一條 return 只能是 return nil 或 return "<CODE>"
    (可帶 if / unless 修飾)。任何其他合法 Ruby return——單引號、字串插值、heredoc、
    常數、方法回傳——都會轉紅。否則一個掃不到但真的會回傳的 code 就能靜默繞過
    完整性斷言,而宣告集合與實際可回傳集合相等這個命題也就不再成立。

error_contract:
  LOOP_UNBOUNDED: loop.error.unbounded
  LOOP_OVER_TIMEOUT: loop.error.over_timeout
  LOOP_TIMEOUT_NOT_REACHED: loop.error.timeout_not_reached
  LOOP_MISSING_FIELD: loop.error.missing_field
  LOOP_OVER_MAX_ITERATIONS: loop.error.over_max_iterations
  LOOP_MALFORMED_ITERATION: loop.error.malformed_iteration
  LOOP_INVALID_OUTCOME: loop.error.invalid_outcome
  LOOP_OUTCOME_CONDITION_MISMATCH: loop.error.outcome_condition_mismatch
  LOOP_REQUIRED_PRESENT_WITH_GAPS: loop.error.required_present_with_gaps
  LOOP_SCOPE_EXPANSION: loop.error.scope_expansion
  LOOP_SKIPPED_HUMAN_DECISION: loop.error.skipped_human_decision
  LOOP_UNFIXABLE_NOT_LOUD: loop.error.unfixable_not_loud
  LOOP_EVIDENCE_NOT_PRESERVED: loop.error.evidence_not_preserved
  LOOP_EXCEEDS_AUTHORITY: loop.error.exceeds_authority
  FAIL_SILENT: loop.error.fail_silent

runtime_independence: true

cross_reference:
  task_card_record_spec: 規格/v0.1/ai-task-card-record.yaml
  skill_spec: 規格/v0.1/ai-work-record-skill.yaml
  boundary_spec: 規格/v0.1/ai-work-record-boundary.yaml
  must_match:
    card_fields_from: ai-task-card-record.fields
    status_enum_from: ai-task-card-record.status_enum
    draft_card_from: ai-work-record-skill.output_contract.draft_card
    error_behavior_from: ai-work-record-boundary.automated_step_contract.error_behavior_enum

hard_stops:
  - no hook / harness / hermes / runtime here
  - pure function plus data tables only; no state machine engine
  - do not re-define SSP-298 boundary, SSP-299 card format or SSP-300 Skill I/O
  - no registry / FSM / database / canonical writer

required_negative_fixtures:
  - run without a positive max_iterations
  - run without a positive timeout_seconds
  - run without a verifiable elapsed_seconds
  - elapsed_seconds exceeds timeout_seconds without failing loud
  - the run claims a timeout terminal condition without actually exceeding the timeout
  - iterations exceed max_iterations
  - an iteration is missing a required field
  - outcome is not one of the allowed outcomes
  - outcome disagrees with the terminal condition
  - the run claims all required fields are present while a gap remains
  - an iteration fills a scope-defining field
  - a human-decision gap remains but the run did not stop at a blocker
  - a human-decision gap appears mid-run but the run continued
  - an unfixable gap remains but the run did not fail loud
  - an unfixable gap appears mid-run but the run continued
  - failed loud but the original evidence was not preserved
  - run carries a memory acceptance field
  - error but the run still claims success
  - the run carries no iterations field at all
  - the run declares iterations as something other than a list
  - the loop performs memory acceptance itself
  - the loop writes company knowledge itself
