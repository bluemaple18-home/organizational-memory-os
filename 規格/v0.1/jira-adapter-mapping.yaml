schema:
  schema_id: urn:omos:schema:jira-adapter-mapping:0.1.0
  version: 0.1.0
  status: DRAFT_REVIEW_REQUIRED
  date: '2026-09-10'
  traces_to:
    - JIRA-ADAPTER-MAPPING
  builds_on:
    - 規格/v0.1/raw-evidence-envelope.schema.json
    - 規格/v0.1/source-anchor.schema.json
    - 規格/v0.1/source-anchor-jira-cloud-entity-segment-v1.schema.json

purpose:
  statement: >-
    A deterministic mapping contract: how a Jira Cloud issue and its text fields
    (summary, description, comment body, ADF text node) project onto
    RawEvidenceEnvelope (STD-01) and SourceAnchor STD-02 profile
    JIRA_CLOUD_ENTITY_SEGMENT_V1. It also fixes the compound source_version and
    the webhook-plus-reconciliation semantics. It does not re-define STD-01 or
    the Jira anchor profile schema; every projected field name and enum value is
    a real member of the target schema (pointer binding). The positive fixtures
    are complete target instances and the gate validates them against the locked
    STD-01 / base SourceAnchor / Jira profile schemas with a real JSON Schema
    engine. No Jira connector, no REST client, no webhook runtime.
  no_second_workflow_authority: true

jira_field_kinds:
  - SUMMARY
  - DESCRIPTION
  - COMMENT_BODY
  - ADF_TEXT_NODE

raw_evidence_projection:
  source_system: jira-cloud
  entity_type: issue
  source_identity:
    native_id_basis: JIRA_CLOUD_ID_PLUS_ISSUE_ID
    identity_components:
      - cloud_id
      - issue_id
    parent_native_id_basis: JIRA_PROJECT_ID
  source_version:
    basis: COMPOUND_OBSERVED
    kind: UPDATED_AT_DIGEST
    value_basis: ISSUE_UPDATED_TIMESTAMP
    value_format: RFC3339_TIMESTAMP
    secondary_digest_basis: FIELD_ADF_SHA256
    secondary_digest_format: SHA256_LOWER_HEX_64
  source_aliases:
    allowed_alias_basis: ISSUE_KEY
    rule: >-
      an issue key rename adds a source_alias carrying the new key; the evidence
      identity (cloud_id + issue_id) never changes. A run that reports an issue
      key change must carry the new key in raw_evidence.source_aliases and keep
      identity_components equal (JIRA_MAP_ISSUE_KEY_RENAME_NOT_ALIASED otherwise).
  payload:
    structured_profile: I_JSON
    canonicalization_profile: RFC8785_JCS
    payload_ref_is_reference: true
  provenance:
    allowed_ingestion_modes:
      - WEBHOOK
      - POLL
      - BULK_EXPORT
  transport_delivery_kinds:
    - WEBHOOK
    - POLL
  rule: >-
    every projected raw_evidence field key is a property of
    raw-evidence-envelope.schema.json and every enum value is a member of that
    property's enum; source_identity is (cloud_id, issue_id)-addressed so the
    projection is deterministic (JIRA_MAP_NONDETERMINISTIC_IDENTITY otherwise);
    payload.payload_ref is a reference, never inline (JIRA_MAP_PAYLOAD_INLINE);
    source_version.basis is COMPOUND_OBSERVED with kind UPDATED_AT_DIGEST and a
    present secondary_digest (JIRA_MAP_VERSION_NOT_COMPOUND otherwise);
    source_version.secondary_digest matches ^sha256:[0-9a-f]{64}$
    (JIRA_MAP_SECONDARY_DIGEST_MALFORMED otherwise);
    source_version.value is a present RFC3339 timestamp — the observed Jira issue
    updated time — that the validator parses to a real instant
    (JIRA_MAP_VERSION_VALUE_INVALID otherwise); version ordering in reconciliation
    is decided by comparing parsed instants, never by comparing the raw strings,
    so a fractional-second-newer value is still ordered as newer.

source_anchor_projection:
  profile: JIRA_CLOUD_ENTITY_SEGMENT_V1
  required_selector_type: JSON_POINTER
  normalization_profile: OMOS_TEXT_NORM_V1
  profile_details_shape:
    - deployment_type
    - cloud_id
    - entity_type
    - issue_id
    - issue_key_alias
    - field_id
    - json_pointer
    - renderer_profile
    - renderer_version
    - text_selector
  field_id_by_kind:
    SUMMARY: summary
    DESCRIPTION: description
    COMMENT_BODY: comment
    ADF_TEXT_NODE: description
  json_pointer_prefix_by_kind:
    SUMMARY: /fields/summary
    DESCRIPTION: /fields/description
    COMMENT_BODY: /fields/comment/comments
    ADF_TEXT_NODE: /fields/description
  allowed_resolution_status:
    - EXACT_MATCH
    - RELOCATED
    - CONTENT_CHANGED
    - MISSING
    - ACCESS_REVOKED
    - REPRESENTATION_UNAVAILABLE
    - AMBIGUOUS
  rule: >-
    profile is the JIRA_CLOUD_ENTITY_SEGMENT_V1 const; profile_details has
    exactly profile_details_shape (JIRA_MAP_PROFILE_DETAILS_MALFORMED otherwise),
    matching the locked Jira anchor profile schema; deployment_type is CLOUD,
    entity_type is issue, issue_id matches ^[0-9]+$; selectors carries a
    JSON_POINTER selector (JIRA_MAP_SELECTOR_MISSING); text_selector.unit is
    UNICODE_CODE_POINT with START_INCLUSIVE_END_EXCLUSIVE and end >= start;
    normalization_profile is the OMOS_TEXT_NORM_V1 const;
    profile_details.field_id equals field_id_by_kind[field_kind]
    (JIRA_MAP_FIELD_ID_KIND_MISMATCH otherwise) and profile_details.json_pointer
    either equals json_pointer_prefix_by_kind[field_kind] or begins with that
    prefix followed by "/" so the anchor addresses the mapped field and not a
    sibling that merely shares a prefix such as /fields/description_extra
    (JIRA_MAP_JSON_POINTER_FIELD_MISMATCH otherwise). The locked Jira anchor
    profile schema leaves field_id as any non-empty string and only checks JSON
    Pointer syntax, so this field_kind -> field_id / json_pointer binding is
    enforced only here.

reconciliation:
  triggers:
    - WEBHOOK_GAP
    - PERIODIC_SWEEP
  identity_components:
    - cloud_id
    - issue_id
  identity_required: true
  version_decisions:
    - NEW_EVIDENCE
    - NOOP
  rule: >-
    a reconciliation run compares the compound source version (updated timestamp
    value AND secondary_digest) against the last known evidence. previous_version
    is required and current_version, when supplied, must parse; a supplied
    reconciliation version whose value is not a parseable RFC3339 instant is
    JIRA_MAP_RECONCILIATION_VERSION_UNPARSEABLE (no silent fallback to the
    projected version). A strictly newer timestamp yields a new evidence record
    (decision NEW_EVIDENCE); an equal timestamp is a no-op (decision NOOP) only
    when the secondary_digest is also equal — at an equal timestamp with a
    different secondary_digest the compound version has changed and NEW_EVIDENCE
    is required. A decision that disagrees with this observed order — instants
    parsed, not strings — is JIRA_MAP_RECONCILIATION_VERSION_DECISION_MISMATCH.
    Every reconciliation run
    carries both previous_identity and current_identity, each with a non-null
    cloud_id and issue_id (JIRA_MAP_RECONCILIATION_IDENTITY_INCOMPLETE otherwise);
    they are compared component-wise on (cloud_id, issue_id) and any difference is
    JIRA_MAP_RECONCILIATION_IDENTITY_DRIFT regardless of a self-reported
    changed_identity flag; current_identity must also equal the run's actual
    projected identity taken from source_anchor.profile_details.cloud_id /
    issue_id (JIRA_MAP_RECONCILIATION_IDENTITY_DRIFT otherwise). A run that
    self-reports changed_identity true is JIRA_MAP_RECONCILIATION_CHANGES_IDENTITY.
    Reconciliation never drops a detected gap without emitting evidence or a
    quality gap (JIRA_MAP_RECONCILIATION_SILENT_GAP).

projection_instance_consistency:
  rule: >-
    a positive fixture's compact projection and its full raw_evidence_instance /
    source_anchor_instance are not two independent datasets: the validator binds
    them field by field so the schema-valid instance is provably the one this
    mapping produced.
  bound_fields:
    - source_anchor.profile
    - source_anchor.profile_details.field_id
    - source_anchor.profile_details.json_pointer
    - source_anchor.profile_details.cloud_id
    - source_anchor.profile_details.issue_id
    - raw_evidence.source_version.basis
    - raw_evidence.source_version.kind
    - raw_evidence.source_version.value
    - raw_evidence.source_version.secondary_digest
    - raw_evidence.payload.structured_profile
    - raw_evidence.payload.canonicalization_profile
    - raw_evidence.payload.payload_ref
    - raw_evidence.provenance.ingestion_mode
    - reconciliation.current_identity == instance (cloud_id, issue_id)
  full_instance_identity_binding: >-
    both raw_evidence_instance.source_identity and
    source_anchor_instance.source_identity must have source_system=jira-cloud,
    source_instance_id equal to profile_details.cloud_id, entity_type=issue and
    native_id equal to profile_details.issue_id, and the two source_identity
    objects must be equal to each other. A schema-valid instance whose
    source_instance_id or entity_type disagrees with the projection's
    (cloud_id, issue_id) identity fails the gate.

determinism:
  rule: >-
    the same Jira entity snapshot plus the same adapter_id + adapter_version
    produce a byte-identical projection; identity and version derive only from
    Jira-native ids, timestamps and content digests, never from delivery order
    or wall-clock.

instance_validation:
  engine: scripts/validate_jira_adapter_mapping_instances.py
  rule: >-
    each positive fixture carries a full raw_evidence_instance and
    source_anchor_instance; the engine validates raw_evidence_instance against
    raw-evidence-envelope.schema.json and source_anchor_instance against
    source-anchor-jira-cloud-entity-segment-v1.schema.json (which composes the
    base source-anchor.schema.json) with a real Draft 2020-12 engine, and
    confirms every instance_negative case is rejected. A missing required field,
    a wrong nested type / pattern / const fails closed.

error_contract:
  JIRA_MAP_UNKNOWN_FIELD_KIND: jira-map.error.unknown_field_kind
  JIRA_MAP_FIELD_NOT_IN_TARGET_SCHEMA: jira-map.error.field_not_in_target_schema
  JIRA_MAP_NONDETERMINISTIC_IDENTITY: jira-map.error.nondeterministic_identity
  JIRA_MAP_PAYLOAD_INLINE: jira-map.error.payload_inline
  JIRA_MAP_VERSION_NOT_COMPOUND: jira-map.error.version_not_compound
  JIRA_MAP_SECONDARY_DIGEST_MALFORMED: jira-map.error.secondary_digest_malformed
  JIRA_MAP_VERSION_VALUE_INVALID: jira-map.error.version_value_invalid
  JIRA_MAP_PROFILE_MISMATCH: jira-map.error.profile_mismatch
  JIRA_MAP_SELECTOR_MISSING: jira-map.error.selector_missing
  JIRA_MAP_PROFILE_DETAILS_MALFORMED: jira-map.error.profile_details_malformed
  JIRA_MAP_FIELD_ID_KIND_MISMATCH: jira-map.error.field_id_kind_mismatch
  JIRA_MAP_JSON_POINTER_FIELD_MISMATCH: jira-map.error.json_pointer_field_mismatch
  JIRA_MAP_RECONCILIATION_CHANGES_IDENTITY: jira-map.error.reconciliation_changes_identity
  JIRA_MAP_RECONCILIATION_IDENTITY_INCOMPLETE: jira-map.error.reconciliation_identity_incomplete
  JIRA_MAP_RECONCILIATION_IDENTITY_DRIFT: jira-map.error.reconciliation_identity_drift
  JIRA_MAP_RECONCILIATION_VERSION_UNPARSEABLE: jira-map.error.reconciliation_version_unparseable
  JIRA_MAP_ISSUE_KEY_RENAME_NOT_ALIASED: jira-map.error.issue_key_rename_not_aliased
  JIRA_MAP_RECONCILIATION_VERSION_DECISION_MISMATCH: jira-map.error.reconciliation_version_decision_mismatch
  JIRA_MAP_RECONCILIATION_SILENT_GAP: jira-map.error.reconciliation_silent_gap
  FAIL_SILENT: jira-map.error.fail_silent

runtime_independence: true

cross_reference:
  raw_evidence_schema: 規格/v0.1/raw-evidence-envelope.schema.json
  base_source_anchor_schema: 規格/v0.1/source-anchor.schema.json
  jira_anchor_profile_schema: 規格/v0.1/source-anchor-jira-cloud-entity-segment-v1.schema.json
  must_match:
    source_version_basis_from: raw-evidence-envelope.properties.source_version.basis.enum
    source_version_kind_from: raw-evidence-envelope.properties.source_version.kind.enum
    ingestion_mode_from: raw-evidence-envelope.properties.provenance.ingestion_mode.enum
    raw_evidence_required_from: raw-evidence-envelope.required
    base_source_anchor_required_from: source-anchor.required
    jira_profile_const_from: source-anchor-jira-cloud-entity-segment-v1.profile.const
    jira_profile_details_shape_from: source-anchor-jira-cloud-entity-segment-v1.profile_details.required

hard_stops:
  - no jira connector / REST client / webhook runtime here
  - pure mapping tables plus a thin validator; no state machine engine
  - do not re-define STD-01 or the Jira anchor profile schema
  - no Job Engine / WorkPool / Knowledge DB

required_negative_fixtures:
  - a field kind outside SUMMARY / DESCRIPTION / COMMENT_BODY / ADF_TEXT_NODE
  - a projected field is not a property of the target schema
  - source identity uses a non-native basis
  - the payload is inline content instead of a reference
  - the source version is not compound-observed with a secondary digest
  - the compound source version secondary digest is not a locked sha256
  - the compound source version has no observed updated timestamp
  - the source anchor profile is not the Jira cloud entity segment profile
  - the JSON_POINTER selector is missing
  - profile_details has the wrong key set
  - the anchor field id does not match the field kind
  - the anchor json pointer does not address the mapped field
  - the anchor json pointer only shares a prefix with the mapped field
  - the full instance evidence identity uses a different cloud id than the projection
  - the full instance source identity is not the issue entity type
  - reconciliation changes an existing evidence identity
  - reconciliation omits the before or after evidence identity
  - reconciliation before and after evidence identity differ
  - the reconciliation current identity does not match the projected identity
  - an issue key rename is not recorded as a source alias
  - reconciliation version decision disagrees with the observed version order
  - a reconciliation version value does not parse
  - an equal-timestamp reconciliation with a different secondary digest is treated as a no-op
  - a fractional-second newer version is still ordered as newer
  - reconciliation drops a detected gap without emitting evidence
  - error but the mapping still claims success

required_instance_negative_fixtures:
  - a projected RawEvidenceEnvelope is missing a locked required field
  - a projected Jira SourceAnchor is missing a base SourceAnchor required field
  - a projected Jira SourceAnchor text_selector has a wrong nested shape
