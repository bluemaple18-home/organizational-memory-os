schema:
  schema_id: urn:omos:schema:document-adapter-mapping:0.1.0
  version: 0.1.0
  status: DRAFT_REVIEW_REQUIRED
  date: '2026-09-09'
  traces_to:
    - DOC-ADAPTER-MAPPING
  builds_on:
    - 規格/v0.1/raw-evidence-envelope.schema.json
    - 規格/v0.1/source-anchor.schema.json
    - 規格/v0.1/source-anchor-pdf-region-v1.schema.json
    - 規格/v0.1/source-anchor-markdown-text-v1.schema.json
    - 規格/v0.1/normalized-document-block.schema.json

purpose:
  statement: >-
    A deterministic mapping contract: how a document source (PDF, Markdown)
    projects onto the locked STD schemas -- RawEvidenceEnvelope (STD-01), the
    profile-specific SourceAnchor schema (STD-02 PDF_REGION_V1 /
    MARKDOWN_TEXT_V1) and NormalizedDocument block subset (STD-03). It does not
    re-define any STD schema: profile_details is the exact locked
    profile-specific shape, and every projected RawEvidenceEnvelope /
    SourceAnchor / NormalizedDocumentBlock must be a schema-valid instance of
    the locked target schema (checked by a JSON Schema engine). No connector,
    parser or ingestion runtime.
  no_second_workflow_authority: true

source_kinds:
  - PDF
  - MARKDOWN

raw_evidence_projection:
  source_system: document
  entity_type_by_kind:
    PDF: PDF
    MARKDOWN: MARKDOWN
  native_id_basis: CONTENT_SHA256
  source_version:
    basis: CONTENT_ONLY
    kind: CONTENT_DIGEST
    value_is_null: true
  payload:
    structured_profile_by_kind:
      PDF: BINARY
      MARKDOWN: TEXT
    canonicalization_profile: NONE
    payload_ref_is_reference: true
  provenance:
    allowed_ingestion_modes:
      - MANUAL_UPLOAD
      - BULK_EXPORT
  digests:
    raw_digest_basis: SOURCE_BYTES_SHA256
    canonical_digest_by_kind:
      PDF: null
      MARKDOWN: NORMALIZED_TEXT_SHA256
  rule: >-
    the projected RawEvidenceEnvelope is a schema-valid instance of
    raw-evidence-envelope.schema.json (DOC_MAP_TARGET_INSTANCE_INVALID
    otherwise); payload.payload_ref is a reference string, never inline content
    (DOC_MAP_PAYLOAD_INLINE); source_identity.native_id_basis is CONTENT_SHA256
    so identity is content-addressed (DOC_MAP_NONDETERMINISTIC_IDENTITY
    otherwise).

source_anchor_projection:
  profile_by_kind:
    PDF: PDF_REGION_V1
    MARKDOWN: MARKDOWN_TEXT_V1
  required_selector_type_by_kind:
    PDF: PDF_REGION
    MARKDOWN: TEXT_POSITION
  normalization_profile: OMOS_TEXT_NORM_V1
  profile_details_shape:
    PDF_REGION_V1:
      - page
      - page_number_basis
      - bbox
      - block_id
      - char_range
      - char_representation_ref
      - char_representation_digest
      - selected_text
    MARKDOWN_TEXT_V1:
      - codepoint_range
      - line_range
      - line_number_basis
      - heading_path
      - selected_text
  allowed_resolution_status:
    - EXACT_MATCH
    - RELOCATED
    - CONTENT_CHANGED
    - MISSING
    - ACCESS_REVOKED
    - REPRESENTATION_UNAVAILABLE
    - AMBIGUOUS
  rule: >-
    profile matches the source kind (DOC_MAP_PROFILE_MISMATCH); the projected
    SourceAnchor is a schema-valid instance of the profile-specific locked
    schema -- source-anchor-pdf-region-v1.schema.json for PDF,
    source-anchor-markdown-text-v1.schema.json for Markdown -- which itself
    references the base source-anchor.schema.json
    (DOC_MAP_TARGET_INSTANCE_INVALID otherwise); profile_details has exactly the
    keys of the locked profile schema's profile_details.required
    (DOC_MAP_PROFILE_DETAILS_NOT_LOCKED_SHAPE otherwise); selectors carries at
    least one entry of required_selector_type (DOC_MAP_SELECTOR_MISSING);
    normalization_profile is the OMOS_TEXT_NORM_V1 const.

normalized_document_projection:
  allowed_block_types:
    - title
    - section_header
    - paragraph
    - list_item
    - code
    - table
    - image
    - unknown
  content_layer_by_block_type:
    title: TITLE
    section_header: TITLE
    paragraph: BODY
    list_item: BODY
    code: CODE
    table: TABLE
    image: IMAGE
    unknown: UNKNOWN
  attribute_required_by_block_type:
    table: table
    image: asset
  rule: >-
    every projected NormalizedDocumentBlock is a schema-valid instance of
    normalized-document-block.schema.json (DOC_MAP_TARGET_INSTANCE_INVALID
    otherwise), which fixes block_id as a UUIDv7 urn, the table / image
    attribute nested shapes and the source_anchor_refs urn pattern;
    content_layer equals content_layer_by_block_type[block_type]
    (DOC_MAP_CONTENT_LAYER_MISMATCH); a `table` block carries attributes.table
    and an `image` block carries attributes.asset
    (DOC_MAP_TABLE_IMAGE_ATTR_MISSING); every block has a non-empty
    source_anchor_refs (DOC_MAP_BLOCK_NOT_ANCHORED).

deterministic_derivation:
  inputs:
    - content_digest
    - adapter_id
    - adapter_version
  derived:
    - native_id
    - source_version
    - digests
    - idempotency_key
    - projection_digest
  rule: >-
    native_id, source_version, digests, idempotency_key and the whole projection
    are a pure function of (content_digest, adapter_id, adapter_version). Two
    runs with identical inputs must produce an identical projection_digest; a
    difference is DOC_MAP_NONDETERMINISTIC_IDENTITY. Nothing in the projection
    derives from wall-clock, upload order or delivery sequence.

error_contract:
  DOC_MAP_UNKNOWN_SOURCE_KIND: doc-map.error.unknown_source_kind
  DOC_MAP_TARGET_INSTANCE_INVALID: doc-map.error.target_instance_invalid
  DOC_MAP_NONDETERMINISTIC_IDENTITY: doc-map.error.nondeterministic_identity
  DOC_MAP_PAYLOAD_INLINE: doc-map.error.payload_inline
  DOC_MAP_PROFILE_MISMATCH: doc-map.error.profile_mismatch
  DOC_MAP_SELECTOR_MISSING: doc-map.error.selector_missing
  DOC_MAP_PROFILE_DETAILS_NOT_LOCKED_SHAPE: doc-map.error.profile_details_not_locked_shape
  DOC_MAP_BLOCK_TYPE_UNKNOWN: doc-map.error.block_type_unknown
  DOC_MAP_CONTENT_LAYER_MISMATCH: doc-map.error.content_layer_mismatch
  DOC_MAP_TABLE_IMAGE_ATTR_MISSING: doc-map.error.table_image_attr_missing
  DOC_MAP_BLOCK_NOT_ANCHORED: doc-map.error.block_not_anchored
  FAIL_SILENT: doc-map.error.fail_silent

runtime_independence: true

cross_reference:
  raw_evidence_schema: 規格/v0.1/raw-evidence-envelope.schema.json
  source_anchor_pdf_schema: 規格/v0.1/source-anchor-pdf-region-v1.schema.json
  source_anchor_markdown_schema: 規格/v0.1/source-anchor-markdown-text-v1.schema.json
  normalized_document_block_schema: 規格/v0.1/normalized-document-block.schema.json
  must_match:
    payload_structured_profile_from: raw-evidence-envelope.properties.payload.structured_profile.enum
    pdf_profile_details_shape_from: source-anchor-pdf-region-v1.profile_details.required
    markdown_profile_details_shape_from: source-anchor-markdown-text-v1.profile_details.required
    selector_type_from: source-anchor.properties.selectors.items.selector_type.enum
    block_type_from: normalized-document-block.properties.block_type.enum
    content_layer_from: normalized-document-block.properties.content_layer.enum

instance_validation:
  engine: scripts/validate_document_adapter_mapping_instances.py
  targets:
    raw_evidence_instance: raw-evidence-envelope.schema.json
    source_anchor_instance: profile-specific STD-02 schema by source kind
    block_instances: normalized-document-block.schema.json
  rule: >-
    the companion JSON Schema engine validates every positive-fixture instance
    against its locked target schema and asserts every instance_negative case
    fails; a missing required field, wrong type, wrong pattern or wrong nested
    shape is DOC_MAP_TARGET_INSTANCE_INVALID.

hard_stops:
  - no connector / parser / ingestion runtime here
  - pure mapping tables plus a thin validator + JSON Schema engine; no state machine engine
  - do not re-define STD-01 / STD-02 / STD-03 or any profile-specific schema
  - no Job Engine / WorkPool / Knowledge DB

required_negative_fixtures:
  - a source kind outside PDF / MARKDOWN
  - the source anchor profile does not match the source kind
  - the required selector type is missing
  - profile_details is not the locked profile-schema shape
  - a block content_layer disagrees with its block type
  - a table or image block is missing its attributes
  - a block has no source anchor reference
  - the payload is inline content instead of a reference
  - source identity uses a non-content basis
  - two runs with identical inputs produce a different projection
  - error but the mapping still claims success

required_instance_negative_fixtures:
  - a projected RawEvidenceEnvelope is missing a locked required field
  - a projected SourceAnchor uses the old custom profile_details shape
  - a projected block table attribute has the wrong nested shape
