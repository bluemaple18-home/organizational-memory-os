            - legal_hold_absent
        SHARED_WORK_CONTEXT:
          decision: CONDITIONAL
          required_conditions:
            - policy_bound_system
            - retention_allows_delete
            - legal_hold_absent
      EXPORT:
        EMPLOYEE_PRIVATE:
          decision: DENY
          required_conditions: []
        COMPANY_MANAGED_PERSONAL:
          decision: DENY
