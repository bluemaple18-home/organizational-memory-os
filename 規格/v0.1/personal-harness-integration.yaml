          decision: DENY
          required_conditions: []
      PROMOTE:
        EMPLOYEE_PRIVATE:
          decision: DENY
          required_conditions: []
        COMPANY_MANAGED_PERSONAL:
          decision: DENY
          required_conditions: []
        SHARED_WORK_CONTEXT:
          decision: DENY
          required_conditions: []
  retention_and_lifecycle_policy:
    legal_hold_overrides_delete_and_purge: true
    offboarding_requires:
      - mode_specific_disposition
      - export_or_notice_decision
      - private_material_redaction_before_shared_retention
      - audit_receipt
    delete_semantics:
      EMPLOYEE_PRIVATE: remove_payload_or_tombstone_subject_to_legal_hold
      COMPANY_MANAGED_PERSONAL: request_delete_or_archive_subject_to_company_policy
      SHARED_WORK_CONTEXT: redact_private_material_and_retain_work_provenance_when_allowed
    export_semantics:
      EMPLOYEE_PRIVATE: employee_export_allowed_when_policy_and_legal_hold_allow
      COMPANY_MANAGED_PERSONAL: employee_export_requires_company_policy_and_notice
      SHARED_WORK_CONTEXT: export_only_own_contribution_or_redacted_context
  source_acl_inheritance:
    rule: source ACL is a ceiling; personal memory may narrow but cannot widen without promotion gate
    required_receipts:
      - source_acl_snapshot
      - personal_acl_decision
      - policy_ref
  promotion_widening_gate:
    required:
      - promotion_proposal
      - evidence_support_check
      - source_acl_check
      - redaction_complete
      - reviewer_approval
      - canonical_single_writer
    forbidden:
      - direct_copy_to_shared_canonical
      - model_confidence_only
      - admin_override_without_review

capability_levels:
  L1:
    name: 基礎
    behavior:
      - manual evidence capture or marking
      - candidate generation
      - employee confirmation
      - basic recall with citation
  L2:
    name: 自動化
    behavior:
      - automatic source ingestion
      - deterministic dedup/version/ACL/retention handling
      - automatic candidate queue
  L3:
    name: 智慧化
    behavior:
      - cross-source object linking
      - WorkRecord correlation
      - conflict/freshness/gap suggestions
      - context-aware recall
      - promotion suggestions
  L4:
    name: 自治化
    behavior:
      - continuous stale/conflict/gap monitoring
      - correction and promotion proposals
      - projection rebuild and regression evaluation
    authority_gate_required: true
  same_contract_all_levels: true

capability_matrix:
  purpose: >-
    Machine-readable grant of automation depth per capability level. Higher
    levels are cumulative supersets of lower levels; the shared core contract
    does not change across levels.
  capabilities:
    - manual_capture
    - candidate_generation
    - employee_confirmation
    - basic_recall_with_citation
    - automatic_source_ingestion
    - deterministic_dedup_version_acl_retention
    - automatic_candidate_queue
    - cross_source_object_linking
    - workrecord_correlation
    - conflict_freshness_gap_suggestion
    - context_aware_recall
    - promotion_suggestion
    - continuous_stale_conflict_gap_monitoring
    - correction_proposal
    - promotion_proposal
    - projection_rebuild_regression_evaluation
  cumulative: true
  grants:
    L1:
      - manual_capture
      - candidate_generation
      - employee_confirmation
      - basic_recall_with_citation
    L2:
      - automatic_source_ingestion
      - deterministic_dedup_version_acl_retention
      - automatic_candidate_queue
    L3:
      - cross_source_object_linking
      - workrecord_correlation
      - conflict_freshness_gap_suggestion
      - context_aware_recall
      - promotion_suggestion
    L4:
      - continuous_stale_conflict_gap_monitoring
      - correction_proposal
      - promotion_proposal
      - projection_rebuild_regression_evaluation
  grant_semantics: >-
    grants[Ln] lists the capabilities first unlocked at level Ln. The effective
    grant for a level is the union of its own row and every lower level. A
    profile at level Ln must not claim a capability whose first-unlock level is
    above Ln.
  level_gated_actions:
    L4:
      - correction_proposal
      - promotion_proposal

level_transitions:
  single_step_only: true
  allowed_upgrades:
    L1:
      - L2
    L2:
      - L3
    L3:
      - L4
    L4: []
  allowed_downgrades:
    L4:
      - L3
    L3:
      - L2
    L2:
      - L1
    L1: []
  transition_requirements:
    - authorized_actor
    - reason_recorded
  downgrade_rules:
    must_preserve_safety_floor: true
    reduces_automation_depth_only: true
  forbidden:
    - multi_step_jump
    - unauthorized_actor
    - downgrade_that_removes_safety_floor
    - transition_that_forks_core_contract

capability_safety_floor:
  invariants:
    - permission_before_retrieval
    - provenance_required
    - canonical_single_writer
    - candidate_not_auto_accepted_by_level
    - promotion_requires_widening_gate
  l4_authority_gate:
    authority_gate_required: true
    gated_actions:
      - correction_proposal
      - promotion_proposal
  applies_to_all_levels: true
  downgrade_preserves_all_invariants: true
  statement: >-
    Lowering the capability level reduces automation depth only. It never
    removes permission-before-retrieval, provenance, canonical single writer,
    the candidate acceptance gate, the promotion widening gate, or the L4
    authority gate.

core_pipeline:
  - SOURCE
  - RAW_EVIDENCE
  - OBJECT_LINKING
  - WORK_RECORD_PROJECTION
  - PERSONAL_MEMORY_CANDIDATE
  - VERIFICATION
  - PERSONAL_ACCEPTANCE
  - PERSONAL_MEMORY_RECORD
  - RECALL_OR_CORRECTION
  - OPTIONAL_PROMOTION_PROPOSAL

# repo #5 稽核 F-01（2026-09-16 發現，2026-09-17 收斂）：core_pipeline 的中段
# 是 canonical 升格路徑的重述，但過去沒有任何東西宣告這件事，也沒有 validator
# 讀它——相鄰的 core_invariants 反而有被 boundary validator 斷言。
#
# 這裡明確宣告「哪一段是重述、重述了上游的哪些步驟」。covers 必須逐項都是
# 上游**現在**仍存在的步驟，所以上游若移除或改名某步，這裡會立刻變成孤兒而
# 轉紅——那正是單靠「順序與跳步檢查」補不到的缺口（舊名稱會直接從比對範圍
# 消失，靜默通過）。
core_pipeline_promotion_binding:
  promotion_path_ref: ai-work-record-boundary.promotion_path.ordered_steps
  covers:
    - PERSONAL_MEMORY_CANDIDATE
    - VERIFICATION
    - PERSONAL_ACCEPTANCE
    - PERSONAL_MEMORY_RECORD
  rule: >-
    The listed steps are a restatement of the canonical promotion path, not an
    independent ordering. Each must be a step that currently exists in
    ai-work-record-boundary.promotion_path.ordered_steps, they must appear in
    that same relative order, and they must be contiguous there -- core_pipeline
    may describe only part of the canonical path, but it may not silently drop a
    step from the part it does describe. core_pipeline's own additional stages
    (SOURCE, OBJECT_LINKING, RECALL_OR_CORRECTION, ...) are outside the canonical
    path and are not governed by this binding.

core_invariants:
  - RAW_EVIDENCE_NE_PERSONAL_MEMORY
  - WORK_RECORD_NE_PERSONAL_MEMORY
  - CANDIDATE_NE_ACCEPTED_PERSONAL_MEMORY
  - PERSONAL_CANONICAL_MEMORY_IS_PERSONAL_SCOPE_ONLY
  - PERSONAL_MEMORY_NE_COMPANY_CANONICAL_KNOWLEDGE
  - CAPTURED_NE_REMEMBERED
  - MODEL_CONFIDENCE_NE_VERIFICATION
  - OBJECT_LINK_NE_PERMISSION_EXPANSION
  - CORRECTION_CREATES_REVISION_NOT_HISTORY_ERASURE
  - PROMOTION_REQUIRES_PROPOSAL_REVIEW_AND_SINGLE_WRITER
  - GENERAL_EMPLOYEE_NEEDS_NO_AI_CORE
  - ROLE_PROFILE_NE_CORE_SCHEMA_AUTHORITY

contract_registry:
  reuse_existing:
    - RawEvidenceEnvelope
    - SourceAnchor
    - Object
    - ObjectLinkAssertion
    - WorkRecord
    - VerificationReceipt
    - AcceptanceReceipt
    - CanonicalWriteReceipt
  define_for_employee_memory:
    EmployeeMemoryProfile:
      purpose: employee identity, role/source configuration, policy, level
    PersonalMemoryCandidate:
      purpose: unaccepted durable-memory proposal
    PersonalMemoryRecord:
      purpose: accepted memory inside PERSONAL scope
    MemorySupportLink:
      purpose: exact evidence and source-anchor support
    MemoryConflictSet:
      purpose: contradictory or scope/time-qualified memories
    MemoryCorrectionProposal:
      purpose: employee/model correction request with evidence
      required_fields_ref: correction_flow.contract.proposal_required_fields
    MemorySupersessionReceipt:
      purpose: immutable history of replace/invalidate/amend decision
      required_fields_ref: correction_flow.contract.supersession_receipt_required_fields
    MemoryContextPack:
      purpose: permission-aware bounded recall result
      required_fields_ref: recall_context_pack.contract.pack_required_fields
    MemoryPromotionProposal:
      purpose: PERSONAL to TEAM/DEPARTMENT/COMPANY/CLIENT proposal
    MemoryProjectionManifest:
      purpose: rebuildable human-readable views and summaries

