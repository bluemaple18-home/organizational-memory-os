schema:
  schema_id: urn:omos:schema:employee-personal-memory-standard:0.3.0
  version: 0.3.0
  status: DRAFT_REVIEW_REQUIRED
  date: '2026-08-30'

purpose:
  statement: >-
    Define one logical personal-memory contract and lifecycle for every employee,
    independent of role, source tool, model, agent runtime, or deployment mode.
  company_knowledge_preparation: true
  ai_core_carve_out: false
  ai_core_full_clone_per_employee: false

standardization_model:
  shared_across_all_employees:
    - contract families
    - identifiers and provenance
    - evidence-to-memory lifecycle
    - permission and retention floor
    - correction and supersession
    - personal-to-shared promotion proposal
    - recall/context-pack contract
  configurable_per_role_or_tenant:
    - source adapters
    - role profile
    - capability level
    - sensitivity defaults
    - retention defaults
    - review requirements
    - context priorities
  statement: SAME_CORE_CONTRACT_PLUS_ROLE_PROFILE

product_authority:
  organizational_memory_os:
    owns:
      - employee personal memory standard
      - personal memory governance
      - scope and permission semantics
      - promotion proposal boundary
      - organizational canonical knowledge boundary
  ai_core:
    role: DEVELOPER_SPECIFIC_DONOR_AND_ADAPTER
    owns_its_complete_system: true
    not_required_for_general_employees: true
  runtime_and_agents:
    role: OPTIONAL_EXECUTOR
    authority_over_memory: false

employee_memory_scope_modes:
  - EMPLOYEE_PRIVATE
  - COMPANY_MANAGED_PERSONAL
  - SHARED_WORK_CONTEXT
  rule: >-
    Scope mode, visibility, retention, export, deletion, and offboarding behavior
    must be explicit; PERSONAL never implies company-wide search authority.

capability_levels:
  L1:
    name: 基礎
    behavior:
      - manual evidence capture or marking
      - candidate generation
      - employee confirmation
      - basic recall with citation
  L2:
    name: 自動化
    behavior:
      - automatic source ingestion
      - deterministic dedup/version/ACL/retention handling
      - automatic candidate queue
  L3:
    name: 智慧化
    behavior:
      - cross-source object linking
      - WorkRecord correlation
      - conflict/freshness/gap suggestions
      - context-aware recall
      - promotion suggestions
  L4:
    name: 自治化
    behavior:
      - continuous stale/conflict/gap monitoring
      - correction and promotion proposals
      - projection rebuild and regression evaluation
    authority_gate_required: true
  same_contract_all_levels: true

core_pipeline:
  - SOURCE
  - RAW_EVIDENCE
  - OBJECT_LINKING
  - WORK_RECORD_PROJECTION
  - PERSONAL_MEMORY_CANDIDATE
  - VERIFICATION
  - PERSONAL_ACCEPTANCE
  - PERSONAL_MEMORY_RECORD
  - RECALL_OR_CORRECTION
  - OPTIONAL_PROMOTION_PROPOSAL

core_invariants:
  - RAW_EVIDENCE_NE_PERSONAL_MEMORY
  - WORK_RECORD_NE_PERSONAL_MEMORY
  - CANDIDATE_NE_ACCEPTED_PERSONAL_MEMORY
  - PERSONAL_CANONICAL_MEMORY_IS_PERSONAL_SCOPE_ONLY
  - PERSONAL_MEMORY_NE_COMPANY_CANONICAL_KNOWLEDGE
  - CAPTURED_NE_REMEMBERED
  - MODEL_CONFIDENCE_NE_VERIFICATION
  - OBJECT_LINK_NE_PERMISSION_EXPANSION
  - CORRECTION_CREATES_REVISION_NOT_HISTORY_ERASURE
  - PROMOTION_REQUIRES_PROPOSAL_REVIEW_AND_SINGLE_WRITER
  - GENERAL_EMPLOYEE_NEEDS_NO_AI_CORE
  - ROLE_PROFILE_NE_CORE_SCHEMA_AUTHORITY

contract_registry:
  reuse_existing:
    - RawEvidenceEnvelope
    - SourceAnchor
    - Object
    - ObjectLinkAssertion
    - WorkRecord
    - VerificationReceipt
    - AcceptanceReceipt
    - CanonicalWriteReceipt
  define_for_employee_memory:
    EmployeeMemoryProfile:
      purpose: employee identity, role/source configuration, policy, level
    PersonalMemoryCandidate:
      purpose: unaccepted durable-memory proposal
    PersonalMemoryRecord:
      purpose: accepted memory inside PERSONAL scope
    MemorySupportLink:
      purpose: exact evidence and source-anchor support
    MemoryConflictSet:
      purpose: contradictory or scope/time-qualified memories
    MemoryCorrectionProposal:
      purpose: employee/model correction request with evidence
    MemorySupersessionReceipt:
      purpose: immutable history of replace/invalidate/amend decision
    MemoryContextPack:
      purpose: permission-aware bounded recall result
    MemoryPromotionProposal:
      purpose: PERSONAL to TEAM/DEPARTMENT/COMPANY/CLIENT proposal
    MemoryProjectionManifest:
      purpose: rebuildable human-readable views and summaries

employee_memory_profile_minimum:
  identity:
    - tenant_id
    - employee_id
    - role_profile
  source_policy:
    - connector_grants
    - consent_or_notice_ref
    - capture_scope
  memory_policy:
    - capability_level
    - personal_scope_mode
    - sensitivity_policy_ref
    - retention_policy_ref
    - promotion_policy_ref
    - context_budget_policy_ref

memory_kinds_phase_1:
  - WORK_PREFERENCE
  - WORKING_STYLE
  - DOMAIN_FACT
  - DEFINITION
  - RULE
  - DECISION
  - LESSON
  - PROCEDURE
  - PROJECT_CONTEXT
  - RELATIONSHIP_CONTEXT
  - LONG_LIVED_CONSTRAINT

not_long_lived_memory_by_default:
  - CURRENT_TASK_STATUS
  - ONE_OFF_COMMAND_OUTPUT
  - TRANSIENT_OPEN_LOOP
  - TEMPORARY_BRANCH_OR_WORKTREE_STATE
  - RUNTIME_COMPLETION_MESSAGE
  - UNVERIFIED_MODEL_SUGGESTION
  - SHORT_LIVED_SCHEDULE

personal_memory_record_minimum:
  identity:
    - memory_id
    - tenant_id
    - employee_owner_ref
    - memory_kind
  content:
    - statement_or_structured_content
    - applicability
    - validity_interval
  support:
    - evidence_refs
    - source_anchor_refs
    - provenance
  governance:
    - verification_status
    - acceptance_status
    - sensitivity
    - acl_ref
    - freshness
    - review_due_at
    - conflict_refs
    - supersedes
    - superseded_by
    - retention_state
  chronology:
    - created_at
    - effective_from
    - effective_to
    - reviewed_at

source_profiles:
  universal_examples:
    - OUTLOOK_EMAIL
    - TEAMS_MESSAGE
    - JIRA_ENTITY
    - DOCUMENT
    - MEETING
    - WEB
    - MANUAL_NOTE
  advanced_examples:
    - GIT_ARTIFACT
    - CODEX_RECEIPT
    - AI_CORE_ACCEPTED_RESULT
    - CLAUDE_CODE_RECEIPT
  rule: ALL_SOURCES_MAP_TO_SAME_RAW_EVIDENCE_CONTRACT

role_profiles:
  PM_PROFILE:
    likely_sources:
      - OUTLOOK_EMAIL
      - TEAMS_MESSAGE
      - JIRA_ENTITY
      - DOCUMENT
      - MEETING
  RD_PROFILE:
    likely_sources:
      - JIRA_ENTITY
      - DOCUMENT
      - GIT_ARTIFACT
      - CODEX_RECEIPT
      - AI_CORE_ACCEPTED_RESULT
  MD_PROFILE:
    likely_sources:
      - DOCUMENT
      - TEAMS_MESSAGE
      - CLIENT_FEEDBACK
  SALES_PROFILE:
    likely_sources:
      - CRM_ENTITY
      - OUTLOOK_EMAIL
      - MEETING
      - CLIENT_DOCUMENT
  rules:
    - role profile may configure but not redefine lifecycle
    - extensions must be namespaced
    - role profile cannot bypass promotion review

work_record:
  role: REBUILDABLE_PROJECTION
  answers: what happened in this work
  does_not_answer: what should be remembered long term
  may_generate_candidates: '0..N'

personal_memory_governance:
  required_dimensions:
    - source support
    - scope
    - sensitivity
    - applicability
    - validity
    - freshness
    - confidence
    - conflict
    - correction
    - supersession
    - retention
    - verification
    - acceptance

recall_context_pack:
  input:
    - intent
    - requester_identity
    - requester_scope
    - context_budget
  output:
    - selected_memory_refs
    - source_refs
    - applicability
    - freshness
    - permission_decision_ref
    - omitted_or_gap_notice
    - budget_usage
  permission_strategy: INTERSECTION
  unrestricted_global_personal_memory_search: forbidden

correction_flow:
  - USER_OR_SYSTEM_CORRECTION_EVIDENCE
  - CORRECTION_PROPOSAL
  - VERIFY
  - ACCEPT
  - AMEND_INVALIDATE_OR_SUPERSEDE
  history_erasure: forbidden

promotion_flow:
  source:
    - PersonalMemoryCandidate
    - PersonalMemoryRecord
  target_scopes:
    - TEAM
    - DEPARTMENT
    - COMPANY
    - CLIENT
  required_steps:
    - PromotionProposal
    - permission_and_scope_check
    - evidence_support_check
    - verification
    - review
    - canonical_single_writer
  direct_copy_to_shared_canonical: forbidden

projection_views:
  examples:
    - memory-summary
    - identity-view
    - project-memory-view
    - people-context-view
    - procedure-view
    - role-home
  rebuildable: true
  folder_taxonomy_is_schema_authority: false

ai_core_donor_mapping:
  absorb:
    - memory distillation failure cases
    - preference and working-style patterns
    - lesson decision procedure patterns
    - correction supersession provenance patterns
    - bounded recall and context budget
    - founder-vault projection experience
  do_not_make_universal:
    - task card state
    - branch worktree reservation
    - runtime session or thread
    - model or provider routing
    - code review merge deploy state
    - developer workflow canonical rules
    - physical .memory or .founder-vault layout
  product_position: DEVELOPER_ROLE_SOURCE_ADAPTER

runtime_policy:
  per_employee_local_runtime_required: false
  central_or_on_prem_service_allowed: true
  optional_executors:
    - deterministic_worker
    - bounded_model_worker
    - Codex
    - Claude Code
    - Hermes
    - DeepSeek Harness
  executor_authority_over_memory: false

phase_1_pilot:
  target: product_department
  first_sources:
    - JIRA_ENTITY
    - DOCUMENT
  next_sources_if_policy_ready:
    - TEAMS_MESSAGE
    - OUTLOOK_EMAIL
  slice:
    - Personal Raw Evidence
    - Object Linking and WorkRecord
    - Personal Memory Candidate
    - employee review and acceptance
    - personal recall with citation
    - correction
    - shared promotion proposal

backlog:
  EMEM_00:
    title: Employee Personal Memory Scope and Ownership Contract
    status: READY_FOR_REVIEW
  EMEM_01:
    title: Personal Memory Candidate and Record Schema
    status: BLOCKED_BY_EMEM_00
  EMEM_02:
    title: Personal Evidence Profile and Source Mapping
    status: BLOCKED_BY_STD_00_AND_RAW_EVIDENCE
  EMEM_03:
    title: Recall and MemoryContextPack Contract
    status: BLOCKED_BY_EMEM_01
  EMEM_04:
    title: Personal-to-Shared Promotion Proposal
    status: BLOCKED_BY_EMEM_01_AND_GOVERNANCE
  EMEM_05:
    title: Product Department Vertical Slice
    status: BLOCKED_BY_EMEM_01_TO_04
  EMEM_06:
    title: Role Profiles
    status: DEFER_UNTIL_CORE_CONTRACT_STABLE
  EMEM_07:
    title: AI Core Developer Adapter
    status: DEFER_OPTIONAL

hard_stops:
  - no full AI Core clone per employee
  - no AI Core requirement for general employees
  - no folder taxonomy as company schema
  - no task branch worktree state auto-promoted to memory
  - no role-specific lifecycle fork
  - no personal memory direct write to company canonical knowledge
  - no search-all-personal-memory-before-permission
  - no model-confidence auto-acceptance or auto-promotion
  - no correction history erasure
  - no WorkRecord and memory conflation
  - no mass automatic capture before ownership/privacy policy

required_negative_fixtures:
  - private Teams message auto-promoted to COMPANY
  - employee A memory visible to employee B without permission
  - company admin searches EMPLOYEE_PRIVATE memory by default
  - L2 connector enabled without consent/notice or ACL propagation
  - current Jira task status promoted as long-lived memory
  - temporary branch/worktree state promoted as memory
  - model confidence auto-accepts PersonalMemoryCandidate
  - correction overwrites old memory without supersession receipt
  - stale memory returned without freshness warning
  - role profile redefines core evidence identity
  - AI Core folder layout treated as universal schema
  - personal-to-company promotion bypasses review
