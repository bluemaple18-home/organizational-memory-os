            - redaction_complete
    SYSTEM:
      READ:
        EMPLOYEE_PRIVATE:
          decision: CONDITIONAL
          required_conditions:
            - policy_bound_system
            - is_owner_context
        COMPANY_MANAGED_PERSONAL:
          decision: CONDITIONAL
