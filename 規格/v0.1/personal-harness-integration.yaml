        SHARED_WORK_CONTEXT:
          decision: DENY
          required_conditions: []
      PROMOTE:
        EMPLOYEE_PRIVATE:
          decision: DENY
          required_conditions: []
        COMPANY_MANAGED_PERSONAL:
          decision: DENY
          required_conditions: []
        SHARED_WORK_CONTEXT:
          decision: DENY
          required_conditions: []
  retention_and_lifecycle_policy:
    legal_hold_overrides_delete_and_purge: true
    offboarding_requires:
      - mode_specific_disposition
      - export_or_notice_decision
      - private_material_redaction_before_shared_retention
      - audit_receipt
    delete_semantics:
      EMPLOYEE_PRIVATE: remove_payload_or_tombstone_subject_to_legal_hold
      COMPANY_MANAGED_PERSONAL: request_delete_or_archive_subject_to_company_policy
      SHARED_WORK_CONTEXT: redact_private_material_and_retain_work_provenance_when_allowed
    export_semantics:
      EMPLOYEE_PRIVATE: employee_export_allowed_when_policy_and_legal_hold_allow
      COMPANY_MANAGED_PERSONAL: employee_export_requires_company_policy_and_notice
      SHARED_WORK_CONTEXT: export_only_own_contribution_or_redacted_context
  source_acl_inheritance:
    rule: source ACL is a ceiling; personal memory may narrow but cannot widen without promotion gate
    required_receipts:
      - source_acl_snapshot
      - personal_acl_decision
      - policy_ref
  promotion_widening_gate:
    required:
      - promotion_proposal
      - evidence_support_check
      - source_acl_check
      - redaction_complete
      - reviewer_approval
      - canonical_single_writer
    forbidden:
      - direct_copy_to_shared_canonical
      - model_confidence_only
      - admin_override_without_review

capability_levels:
  L1:
    name: 基礎
    behavior:
      - manual evidence capture or marking
      - candidate generation
      - employee confirmation
      - basic recall with citation
  L2:
    name: 自動化
    behavior:
      - automatic source ingestion
      - deterministic dedup/version/ACL/retention handling
      - automatic candidate queue
  L3:
    name: 智慧化
    behavior:
      - cross-source object linking
      - WorkRecord correlation
      - conflict/freshness/gap suggestions
      - context-aware recall
      - promotion suggestions
  L4:
    name: 自治化
    behavior:
      - continuous stale/conflict/gap monitoring
      - correction and promotion proposals
      - projection rebuild and regression evaluation
    authority_gate_required: true
  same_contract_all_levels: true

core_pipeline:
  - SOURCE
  - RAW_EVIDENCE
  - OBJECT_LINKING
  - WORK_RECORD_PROJECTION
  - PERSONAL_MEMORY_CANDIDATE
  - VERIFICATION
  - PERSONAL_ACCEPTANCE
  - PERSONAL_MEMORY_RECORD
  - RECALL_OR_CORRECTION
  - OPTIONAL_PROMOTION_PROPOSAL

core_invariants:
  - RAW_EVIDENCE_NE_PERSONAL_MEMORY
  - WORK_RECORD_NE_PERSONAL_MEMORY
  - CANDIDATE_NE_ACCEPTED_PERSONAL_MEMORY
  - PERSONAL_CANONICAL_MEMORY_IS_PERSONAL_SCOPE_ONLY
  - PERSONAL_MEMORY_NE_COMPANY_CANONICAL_KNOWLEDGE
  - CAPTURED_NE_REMEMBERED
  - MODEL_CONFIDENCE_NE_VERIFICATION
  - OBJECT_LINK_NE_PERMISSION_EXPANSION
  - CORRECTION_CREATES_REVISION_NOT_HISTORY_ERASURE
  - PROMOTION_REQUIRES_PROPOSAL_REVIEW_AND_SINGLE_WRITER
  - GENERAL_EMPLOYEE_NEEDS_NO_AI_CORE
  - ROLE_PROFILE_NE_CORE_SCHEMA_AUTHORITY

contract_registry:
  reuse_existing:
    - RawEvidenceEnvelope
    - SourceAnchor
    - Object
    - ObjectLinkAssertion
    - WorkRecord
    - VerificationReceipt
    - AcceptanceReceipt
    - CanonicalWriteReceipt
  define_for_employee_memory:
    EmployeeMemoryProfile:
      purpose: employee identity, role/source configuration, policy, level
    PersonalMemoryCandidate:
      purpose: unaccepted durable-memory proposal
    PersonalMemoryRecord:
      purpose: accepted memory inside PERSONAL scope
    MemorySupportLink:
      purpose: exact evidence and source-anchor support
    MemoryConflictSet:
      purpose: contradictory or scope/time-qualified memories
    MemoryCorrectionProposal:
      purpose: employee/model correction request with evidence
    MemorySupersessionReceipt:
      purpose: immutable history of replace/invalidate/amend decision
    MemoryContextPack:
      purpose: permission-aware bounded recall result
    MemoryPromotionProposal:
      purpose: PERSONAL to TEAM/DEPARTMENT/COMPANY/CLIENT proposal
    MemoryProjectionManifest:
      purpose: rebuildable human-readable views and summaries

employee_memory_profile_minimum:
  identity:
    - tenant_id
    - employee_id
    - role_profile
  source_policy:
    - connector_grants
    - consent_or_notice_ref
    - capture_scope
  memory_policy:
    - capability_level
    - personal_scope_mode
    - ownership_mode
    - visibility_scope
    - sensitivity_policy_ref
    - retention_policy_ref
    - promotion_policy_ref
    - context_budget_policy_ref

memory_kinds_phase_1:
  - WORK_PREFERENCE
  - WORKING_STYLE
  - DOMAIN_FACT
  - DEFINITION
  - RULE
  - DECISION
  - LESSON
  - PROCEDURE
  - PROJECT_CONTEXT
  - RELATIONSHIP_CONTEXT
  - LONG_LIVED_CONSTRAINT

not_long_lived_memory_by_default:
  - CURRENT_TASK_STATUS
  - ONE_OFF_COMMAND_OUTPUT
  - TRANSIENT_OPEN_LOOP
  - TEMPORARY_BRANCH_OR_WORKTREE_STATE
  - RUNTIME_COMPLETION_MESSAGE
  - UNVERIFIED_MODEL_SUGGESTION
  - SHORT_LIVED_SCHEDULE

personal_memory_resource_contracts:
  version: 0.1.0
  shared_constraints:
    tenant_id_required: true
    employee_owner_ref_required: true
    id_profile: UUIDv7_URN
    id_templates:
      PersonalMemoryCandidate: urn:omos:personal-memory:candidate:{uuidv7}
      PersonalMemoryRecord: urn:omos:personal-memory:record:{uuidv7}
      MemorySupportLink: urn:omos:personal-memory:support-link:{uuidv7}
      MemoryConflictSet: urn:omos:personal-memory:conflict-set:{uuidv7}
    candidate_not_record_rule: >-
      A PersonalMemoryCandidate is a durable-memory proposal only; it cannot
      become an accepted PersonalMemoryRecord by status, confidence, or label
      mutation. A separate PersonalMemoryRecord requires a distinct record_id,
      origin_candidate_ref, verification receipt, personal acceptance receipt,
      and support links.
    support_target_rule: >-
      Candidate and Record support must point through MemorySupportLink to exact
      Evidence and SourceAnchor refs. Model summaries, completion messages, and
      confidence scores are routing signals only.
    model_summary_as_support: forbidden
    cross_employee_reference_rule: >-
      Any support or member reference that crosses employee_owner_ref requires
      permission_intersection_ref and must not widen the source ACL.
    transient_memory_rule: >-
      Kinds listed in not_long_lived_memory_by_default must fail closed unless a
      later explicit governance contract reclassifies them with support,
      verification, and personal acceptance.
  enums:
    candidate_status:
      - PROPOSED
      - NEEDS_VERIFICATION
      - VERIFIED
      - ACCEPTANCE_REQUESTED
      - ACCEPTED_FOR_RECORD
      - REJECTED
      - BLOCKED
      - SUPERSEDED
    record_status:
      - ACTIVE
      - SUPERSEDED
      - INVALIDATED
      - ARCHIVED
    verification_status:
      - NOT_RUN
      - PARTIAL
      - PASS
      - FAIL
    acceptance_status:
      - PENDING
      - ACCEPTED
      - REJECTED
      - BLOCKED
    support_relation:
      - SUPPORTS
      - QUALIFIES
      - LIMITS
      - CONTRADICTS
      - DERIVED_FROM
    allowed_anchor_resolution_for_support:
      - EXACT_MATCH
      - RELOCATED
    conflict_resolution_status:
      - UNRESOLVED
      - QUALIFIED_BY_SCOPE
      - QUALIFIED_BY_TIME
      - RESOLVED_BY_REVIEW
      - BLOCKED
  resources:
    PersonalMemoryCandidate:
      purpose: unaccepted durable-memory proposal
      identity_kind: PERSONAL_MEMORY_CANDIDATE
      required_fields:
        - candidate_id
        - tenant_id
        - employee_owner_ref
        - memory_kind
        - content.statement_or_structured_content
        - applicability.scope_mode
        - applicability.applies_to_refs
        - validity_interval.effective_from
        - support_link_refs
        - provenance.generated_from_refs
        - provenance.proposed_by
        - governance.ownership_mode
        - governance.visibility_scope
        - governance.sensitivity
        - governance.acl_ref
        - governance.verification_status
        - governance.acceptance_status
        - chronology.created_at
        - candidate_status
      required_support:
        minimum_support_link_refs: 1
        link_resource: MemorySupportLink
        must_resolve_to:
          - RawEvidenceEnvelope
          - SourceAnchor
      lifecycle:
        initial_status: PROPOSED
        allowed_transitions:
          PROPOSED:
            - NEEDS_VERIFICATION
            - VERIFIED
            - REJECTED
            - BLOCKED
          NEEDS_VERIFICATION:
            - VERIFIED
            - REJECTED
            - BLOCKED
          VERIFIED:
            - ACCEPTANCE_REQUESTED
            - REJECTED
            - BLOCKED
          ACCEPTANCE_REQUESTED:
            - ACCEPTED_FOR_RECORD
            - REJECTED
            - BLOCKED
          ACCEPTED_FOR_RECORD:
            - SUPERSEDED
          BLOCKED:
            - NEEDS_VERIFICATION
            - REJECTED
          REJECTED: []
          SUPERSEDED: []
      acceptance_gate:
        acceptance_status_ACCEPTED_requires:
          - governance.verification_status=PASS
          - governance.verification_receipt_ref
          - governance.personal_acceptance_ref
        creates_record: false
      forbidden:
        - record_id
        - resource_kind=PERSONAL_MEMORY_RECORD
        - model_confidence_only
        - memory_kind in not_long_lived_memory_by_default
    PersonalMemoryRecord:
      purpose: accepted memory inside PERSONAL scope
      identity_kind: PERSONAL_MEMORY_RECORD
      required_fields:
        - record_id
        - tenant_id
        - employee_owner_ref
        - origin_candidate_ref
        - memory_kind
        - content.statement_or_structured_content
        - applicability.scope_mode
        - applicability.applies_to_refs
        - validity_interval.effective_from
        - support_link_refs
        - candidate_snapshot.candidate_status
        - candidate_snapshot.verification_status
        - candidate_snapshot.acceptance_status
        - governance.ownership_mode
        - governance.visibility_scope
        - governance.verification_status
        - governance.acceptance_status
        - governance.verification_receipt_ref
        - governance.personal_acceptance_ref
        - governance.sensitivity
        - governance.acl_ref
        - governance.freshness
        - governance.review_due_at
        - governance.conflict_refs
        - governance.supersedes
        - governance.superseded_by
        - governance.retention_state
        - chronology.created_at
        - chronology.effective_from
        - record_status
      creation_gate:
        required:
          - origin_candidate_ref points to PersonalMemoryCandidate
          - record_id differs from origin_candidate_ref
          - candidate_snapshot.candidate_status=ACCEPTED_FOR_RECORD
          - candidate_snapshot.verification_status=PASS
          - candidate_snapshot.acceptance_status=ACCEPTED
          - governance.verification_status=PASS
          - governance.acceptance_status=ACCEPTED
          - governance.verification_receipt_ref
          - governance.personal_acceptance_ref
          - support_link_refs minimum 1
      lifecycle:
        initial_status: ACTIVE
        allowed_transitions:
          ACTIVE:
            - SUPERSEDED
            - INVALIDATED
            - ARCHIVED
          SUPERSEDED:
            - ARCHIVED
          INVALIDATED:
            - ARCHIVED
          ARCHIVED: []
      update_rule: >-
        Corrections create a new revision or supersession receipt; accepted
        records are not overwritten in place.
      forbidden:
        - memory_kind in not_long_lived_memory_by_default
        - missing evidence support
        - missing personal acceptance
    MemorySupportLink:
      purpose: exact evidence and source-anchor support
      identity_kind: MEMORY_SUPPORT_LINK
      required_fields:
        - link_id
        - tenant_id
        - employee_owner_ref
        - target_ref
        - evidence_ref
        - source_anchor_ref
        - source_anchor_profile
        - relation
        - anchor_resolution
        - provenance.created_by
        - provenance.created_at
      allowed_targets:
        - PersonalMemoryCandidate
        - PersonalMemoryRecord
      required_source_refs:
        - RawEvidenceEnvelope.evidence_ref
        - SourceAnchor.source_anchor_ref
      source_anchor_profile_allowed_from: common-vocabulary.source_anchor_profiles.phase_1
      relation_semantics:
        SUPPORTS: evidence supports the memory statement
        QUALIFIES: evidence limits applicability or validity
        LIMITS: evidence restricts scope, actor, time, or confidence
        CONTRADICTS: evidence contributes to MemoryConflictSet
        DERIVED_FROM: memory was derived from a work record or normalized view
      forbidden:
        - model_summary_only
        - source_anchor_ref missing
        - evidence_ref missing
        - anchor_resolution in MISSING/AMBIGUOUS/NOT_CHECKED
    MemoryConflictSet:
      purpose: contradictory or scope/time-qualified memories
      identity_kind: MEMORY_CONFLICT_SET
      required_fields:
        - set_id
        - tenant_id
        - employee_owner_ref
        - member_memory_refs
        - member_owner_refs
        - conflict_type
        - resolution_status
        - support_link_refs
        - created_at
      member_rules:
        minimum_member_memory_refs: 2
        allowed_members:
          - PersonalMemoryCandidate
          - PersonalMemoryRecord
        member_owner_refs_must_match_resolved_members: true
        cross_employee_member_requires: permission_intersection_ref
      support_rules:
        support_links_target_members_only: true
        required_relation: CONTRADICTS
        support_link_target_resource: MemorySupportLink
      resolution_rule: >-
        ConflictSet records contradiction, qualification, or review state only.
        Review or supersession receipts may resolve the conflict elsewhere, but
        the set does not select a winner or grant write authority by itself.
      forbidden_fields:
        - winner_memory_ref
        - accepted_winner_ref
        - canonical_winner_ref
      forbidden_authority:
        - acceptance
        - canonical_writer
        - winner_selection

