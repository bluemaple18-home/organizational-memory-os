schema:
  schema_id: urn:omos:schema:employee-personal-memory-standard:0.3.0
  version: 0.3.0
  status: DRAFT_REVIEW_REQUIRED
  date: '2026-08-30'

purpose:
  statement: >-
    Define one logical personal-memory contract and lifecycle for every employee,
    independent of role, source tool, model, agent runtime, or deployment mode.
  company_knowledge_preparation: true
  ai_core_carve_out: false
  ai_core_full_clone_per_employee: false

standardization_model:
  shared_across_all_employees:
    - contract families
    - identifiers and provenance
    - evidence-to-memory lifecycle
    - permission and retention floor
    - correction and supersession
    - personal-to-shared promotion proposal
    - recall/context-pack contract
  configurable_per_role_or_tenant:
    - source adapters
    - role profile
    - capability level
    - sensitivity defaults
    - retention defaults
    - review requirements
    - context priorities
  statement: SAME_CORE_CONTRACT_PLUS_ROLE_PROFILE

product_authority:
  organizational_memory_os:
    owns:
      - employee personal memory standard
      - personal memory governance
      - scope and permission semantics
      - promotion proposal boundary
      - organizational canonical knowledge boundary
  ai_core:
    role: DEVELOPER_SPECIFIC_DONOR_AND_ADAPTER
    owns_its_complete_system: true
    not_required_for_general_employees: true
  runtime_and_agents:
    role: OPTIONAL_EXECUTOR
    authority_over_memory: false

employee_memory_scope_modes:
  modes:
    - EMPLOYEE_PRIVATE
    - COMPANY_MANAGED_PERSONAL
    - SHARED_WORK_CONTEXT
  derived_from:
    - ownership_mode
    - visibility_scope
  rule: >-
    Scope mode, visibility, retention, export, deletion, and offboarding behavior
    must be explicit; PERSONAL never implies company-wide search authority.

ownership_visibility_contract:
  ownership_modes:
    EMPLOYEE_CONTROLLED:
      owner_of_memory_statement: employee
      company_default_content_access: forbidden
      employee_export_right: allowed_subject_to_policy
      employee_delete_right: allowed_subject_to_retention_and_legal_hold
    COMPANY_MANAGED_EMPLOYEE_CONTEXT:
      owner_of_memory_statement: company_for_work_purpose
      company_default_content_access: conditional
      employee_export_right: conditional
      employee_delete_right: request_or_tombstone_subject_to_policy
    JOINT_WORK_CONTEXT:
      owner_of_memory_statement: work_group_or_company_context
      company_default_content_access: conditional
      employee_export_right: scoped_to_own_contributions
      employee_delete_right: request_redaction_or_correction
  visibility_scopes:
    SELF_ONLY:
      default_readers:
        - employee_owner
      widening_requires_promotion_gate: true
    EMPLOYEE_AND_POLICY_SYSTEM:
      default_readers:
        - employee_owner
        - policy_bound_system
      widening_requires_promotion_gate: true
    WORK_CONTEXT_PARTICIPANTS:
      default_readers:
        - employee_owner
        - source_acl_participants
        - assigned_reviewer_when_needed
      widening_requires_promotion_gate: true
  mode_definitions:
    EMPLOYEE_PRIVATE:
      ownership_mode: EMPLOYEE_CONTROLLED
      visibility_scope: SELF_ONLY
      semantics: employee-owned private work memory; company cannot search content by default
      consent_or_notice_required: CONSENT_REQUIRED
      retention_default: EMPLOYEE_POLICY_DEFAULT
      offboarding_default: EXPORT_THEN_PURGE_UNLESS_LEGAL_HOLD
    COMPANY_MANAGED_PERSONAL:
      ownership_mode: COMPANY_MANAGED_EMPLOYEE_CONTEXT
      visibility_scope: EMPLOYEE_AND_POLICY_SYSTEM
      semantics: company-managed personal work context with explicit policy-bound access
      consent_or_notice_required: NOTICE_AND_POLICY_REF_REQUIRED
      retention_default: COMPANY_POLICY_DEFAULT
      offboarding_default: TRANSFER_OR_ARCHIVE_WITH_EMPLOYEE_NOTICE
    SHARED_WORK_CONTEXT:
      ownership_mode: JOINT_WORK_CONTEXT
      visibility_scope: WORK_CONTEXT_PARTICIPANTS
      semantics: work-context memory visible only to participants allowed by source ACL and policy
      consent_or_notice_required: NOTICE_REQUIRED
      retention_default: SOURCE_OR_TEAM_POLICY_DEFAULT
      offboarding_default: RETAIN_WORK_CONTEXT_WITH_PRIVATE_MATERIAL_REDACTED
  actor_action_policy:
    EMPLOYEE:
      READ:
        EMPLOYEE_PRIVATE:
          decision: ALLOW
          required_conditions:
            - is_owner
        COMPANY_MANAGED_PERSONAL:
          decision: ALLOW
          required_conditions:
            - is_owner
        SHARED_WORK_CONTEXT:
          decision: ALLOW
          required_conditions:
            - source_acl_allows_requester
      WRITE:
        EMPLOYEE_PRIVATE:
          decision: ALLOW
          required_conditions:
            - is_owner
            - consent_or_notice_present
        COMPANY_MANAGED_PERSONAL:
          decision: ALLOW
          required_conditions:
            - is_owner
            - consent_or_notice_present
            - source_acl_propagated
        SHARED_WORK_CONTEXT:
          decision: ALLOW
          required_conditions:
            - source_acl_allows_requester
            - source_acl_propagated
            - private_material_redacted
      DELETE:
        EMPLOYEE_PRIVATE:
          decision: CONDITIONAL
          required_conditions:
            - is_owner
            - legal_hold_absent
            - retention_allows_delete
        COMPANY_MANAGED_PERSONAL:
          decision: CONDITIONAL
          required_conditions:
            - is_owner
            - legal_hold_absent
            - company_policy_allows_delete
        SHARED_WORK_CONTEXT:
          decision: CONDITIONAL
          required_conditions:
            - is_owner
            - private_material_redacted
            - legal_hold_absent
      EXPORT:
        EMPLOYEE_PRIVATE:
          decision: CONDITIONAL
          required_conditions:
            - is_owner
            - legal_hold_absent
            - export_policy_allows
        COMPANY_MANAGED_PERSONAL:
          decision: CONDITIONAL
          required_conditions:
            - is_owner
            - export_policy_allows
            - company_policy_allows_export
        SHARED_WORK_CONTEXT:
          decision: CONDITIONAL
          required_conditions:
            - is_owner
            - export_policy_allows
            - private_material_redacted
      PROMOTE:
        EMPLOYEE_PRIVATE:
          decision: CONDITIONAL
          required_conditions:
            - is_owner
            - promotion_review_approved
            - scope_widening_checked
            - redaction_complete
        COMPANY_MANAGED_PERSONAL:
          decision: CONDITIONAL
          required_conditions:
            - is_owner
            - promotion_review_approved
            - scope_widening_checked
            - redaction_complete
        SHARED_WORK_CONTEXT:
          decision: CONDITIONAL
          required_conditions:
            - source_acl_allows_requester
            - promotion_review_approved
            - scope_widening_checked
            - redaction_complete
    MANAGER:
      READ:
        EMPLOYEE_PRIVATE:
          decision: DENY
          required_conditions: []
        COMPANY_MANAGED_PERSONAL:
          decision: CONDITIONAL
          required_conditions:
            - manager_business_need
            - company_policy_allows_manager_read
            - employee_notice_given
        SHARED_WORK_CONTEXT:
          decision: CONDITIONAL
          required_conditions:
            - source_acl_allows_requester
            - manager_business_need
      WRITE:
        EMPLOYEE_PRIVATE:
          decision: DENY
          required_conditions: []
        COMPANY_MANAGED_PERSONAL:
          decision: DENY
          required_conditions: []
        SHARED_WORK_CONTEXT:
          decision: CONDITIONAL
          required_conditions:
            - source_acl_allows_requester
            - writes_only_work_context
      DELETE:
        EMPLOYEE_PRIVATE:
          decision: DENY
          required_conditions: []
        COMPANY_MANAGED_PERSONAL:
          decision: DENY
          required_conditions: []
        SHARED_WORK_CONTEXT:
          decision: CONDITIONAL
          required_conditions:
            - retention_allows_delete
            - legal_hold_absent
            - private_material_redacted
      EXPORT:
        EMPLOYEE_PRIVATE:
          decision: DENY
          required_conditions: []
        COMPANY_MANAGED_PERSONAL:
          decision: DENY
          required_conditions: []
        SHARED_WORK_CONTEXT:
          decision: CONDITIONAL
          required_conditions:
            - export_policy_allows
            - source_acl_allows_requester
            - private_material_redacted
      PROMOTE:
        EMPLOYEE_PRIVATE:
          decision: DENY
          required_conditions: []
        COMPANY_MANAGED_PERSONAL:
          decision: CONDITIONAL
          required_conditions:
            - manager_business_need
            - company_policy_allows_manager_promotion
            - employee_notice_given
            - promotion_review_approved
            - scope_widening_checked
            - redaction_complete
        SHARED_WORK_CONTEXT:
          decision: CONDITIONAL
          required_conditions:
            - manager_business_need
            - source_acl_allows_requester
            - promotion_review_approved
            - scope_widening_checked
            - redaction_complete
    ADMIN:
      READ:
        EMPLOYEE_PRIVATE:
          decision: DENY
          required_conditions: []
        COMPANY_MANAGED_PERSONAL:
          decision: CONDITIONAL
          required_conditions:
            - break_glass_approved
            - audit_reason_recorded
            - employee_notice_given
        SHARED_WORK_CONTEXT:
          decision: CONDITIONAL
          required_conditions:
            - admin_policy_scope_allows
            - audit_reason_recorded
      WRITE:
        EMPLOYEE_PRIVATE:
          decision: DENY
          required_conditions: []
        COMPANY_MANAGED_PERSONAL:
          decision: DENY
          required_conditions: []
        SHARED_WORK_CONTEXT:
          decision: DENY
          required_conditions: []
      DELETE:
        EMPLOYEE_PRIVATE:
          decision: DENY
          required_conditions: []
        COMPANY_MANAGED_PERSONAL:
          decision: CONDITIONAL
          required_conditions:
            - retention_allows_delete
            - legal_hold_absent
            - audit_reason_recorded
        SHARED_WORK_CONTEXT:
          decision: CONDITIONAL
          required_conditions:
            - retention_allows_delete
            - legal_hold_absent
            - audit_reason_recorded
      EXPORT:
        EMPLOYEE_PRIVATE:
          decision: DENY
          required_conditions: []
        COMPANY_MANAGED_PERSONAL:
          decision: CONDITIONAL
          required_conditions:
            - export_policy_allows
            - audit_reason_recorded
            - employee_notice_given
        SHARED_WORK_CONTEXT:
          decision: CONDITIONAL
          required_conditions:
            - export_policy_allows
            - admin_policy_scope_allows
            - audit_reason_recorded
      PROMOTE:
        EMPLOYEE_PRIVATE:
          decision: DENY
          required_conditions: []
        COMPANY_MANAGED_PERSONAL:
          decision: DENY
          required_conditions: []
        SHARED_WORK_CONTEXT:
          decision: DENY
          required_conditions: []
    REVIEWER:
      READ:
        EMPLOYEE_PRIVATE:
          decision: CONDITIONAL
          required_conditions:
            - review_assignment
            - employee_consent
            - redaction_complete
        COMPANY_MANAGED_PERSONAL:
          decision: CONDITIONAL
          required_conditions:
            - review_assignment
            - company_policy_allows_review
        SHARED_WORK_CONTEXT:
          decision: CONDITIONAL
          required_conditions:
            - review_assignment
            - source_acl_allows_requester
      WRITE:
        EMPLOYEE_PRIVATE:
          decision: DENY
          required_conditions: []
        COMPANY_MANAGED_PERSONAL:
          decision: DENY
          required_conditions: []
        SHARED_WORK_CONTEXT:
          decision: DENY
          required_conditions: []
      DELETE:
        EMPLOYEE_PRIVATE:
          decision: DENY
          required_conditions: []
        COMPANY_MANAGED_PERSONAL:
          decision: DENY
          required_conditions: []
        SHARED_WORK_CONTEXT:
          decision: DENY
          required_conditions: []
      EXPORT:
        EMPLOYEE_PRIVATE:
          decision: DENY
