        COMPANY_MANAGED_PERSONAL:
          decision: DENY
          required_conditions: []
        SHARED_WORK_CONTEXT:
          decision: DENY
          required_conditions: []
      PROMOTE:
        EMPLOYEE_PRIVATE:
          decision: CONDITIONAL
          required_conditions:
            - review_assignment
            - employee_consent
            - promotion_review_approved
            - scope_widening_checked
            - redaction_complete
        COMPANY_MANAGED_PERSONAL:
          decision: CONDITIONAL
          required_conditions:
            - review_assignment
