schema:
  schema_id: urn:omos:schema:personal-memory-harness-scope:0.2.0
  version: 0.2.0
  status: DRAFT_REVIEW_REQUIRED
  date: '2026-08-30'

scope_correction:
  ai_core_carve_out: false
  statement: >-
    Personal Memory Harness is a bounded memory capability inside or adjacent to
    the existing AI Core. It does not replace, fork, or reproduce the complete AI Core.
  primary_focus: PERSONAL_MEMORY
  supersedes_overbroad_runtime_scope: true

research_basis:
  organizational_memory_os:
    repo: bluemaple18-home/organizational-memory-os
    reviewed_head: 4926265e983ebd968dbaa827685c33000a47bc80
  ai_core:
    repo: bluemaple18-home/aicore
    reviewed_head: 87f6a16cf22642513730ea56530a8b5b1ce4ee99

system_owners:
  complete_ai_core:
    owner: AI Core
    responsibilities:
      - Work lifecycle
      - Task cards
      - Runtime and agents
      - Review and acceptance
      - Rules and skills
      - Git/worktree/branch governance
  personal_memory_capability:
    owner: Personal Memory Team
    responsibilities:
      - Memory source inventory
      - Memory evidence admission
      - Personal memory candidate distillation
      - Personal memory governance
      - Personal canonical memory boundary
      - Founder Vault projections
      - Recall/context return
      - Correction/supersession
  organizational_memory_semantics:
    owner: Organizational Memory OS
    role: semantic and governance donor
    responsibilities:
      - Raw Evidence vocabulary
      - Scope and permission
      - Candidate/canonical separation
      - Verification/acceptance
      - Personal-to-team/company promotion proposal

existing_ai_core_memory_surfaces:
  runtime_memory_log:
    path: .memory/logs/ai_core_memories.jsonl
    provisional_role: RUNTIME_OR_HISTORICAL_MEMORY_EVIDENCE
    authority_status: REQUIRES_PMEM_00_AUDIT
  source_memory_archive:
    path: .memory/archive/source_memories.jsonl
    provisional_role: LEGACY_SOURCE_MEMORY_MATERIAL
    authority_status: HISTORICAL_NOT_CURRENT_BY_NAME_ALONE
  legacy_canonical_archive:
    path: .memory/archive/legacy_canonical_memories.jsonl
    provisional_role: LEGACY_CANONICAL_MEMORY_ARCHIVE
    authority_status: HISTORICAL_NOT_CURRENT_BY_NAME_ALONE
  founder_vault:
    path: .founder-vault/
    provisional_role: FOUNDER_CURATED_PERSONAL_SURFACE
    authority_status: PER_FILE_AUDIT_REQUIRED
  founder_memory_summary:
    path: .founder-vault/memory-summary.md
    role: REBUILDABLE_STARTUP_CONTEXT_PROJECTION
    canonical_authority: false
  ai_core_work:
    paths:
      - .work/
      - docs/task_cards/
      - config/work_lifecycle_contract.json
    role_for_memory_team: UPSTREAM_REFERENCE_ONLY
    memory_team_may_mutate: false

in_scope:
  - AI Core memory surface and authority inventory
  - Memory source/provenance mapping
  - Personal memory candidate taxonomy
  - Personal memory support/conflict/freshness/correction
  - Personal memory acceptance and single-writer boundary
  - Founder Vault and memory-summary projection contract
  - Permission-aware bounded recall/context pack
  - Personal-to-team/company promotion proposal semantics
  - Legacy memory translation mapping without destructive migration

out_of_scope:
  - Complete AI Core extraction or replacement
  - AI Core Work lifecycle redesign
  - Task card schema replacement
  - Runtime Provider Interface or provider registry
  - ExecutionRequest platform
  - Runtime-native event normalization platform
  - Codex/Claude Code/Hermes/DeepSeek Harness adapter implementation
  - Global hook registration
  - Agent Teams or multi-agent runtime
  - Worktree/branch/reservation management
  - Review/merge/push/deploy governance
  - New memory database before authority audit

memory_pipeline:
  - stage: CAPTURE
    flow: AI Core or human source -> OMOS RawEvidence semantics -> Memory Evidence
  - stage: CONSOLIDATE
    flow: Memory Evidence -> classify/deduplicate/conflict/freshness -> Personal Memory Candidate
  - stage: GOVERN_AND_PROMOTE
    flow: Candidate -> review requirement -> acceptance -> Personal Memory Single Writer -> Personal Canonical Memory
  - stage: RECALL_AND_CORRECT
    flow: Intent -> bounded memory context -> AI Core use -> correction evidence -> amend/invalidate/supersede

memory_kinds_phase_1:
  - PREFERENCE
  - WORKING_STYLE
  - PRINCIPLE
  - LESSON
  - DECISION
  - PROJECT_CONTEXT
  - PERSON_CONTEXT
  - PROCEDURE
  - LONG_LIVED_CONSTRAINT

not_long_lived_memory_by_default:
  - current_task_status
  - one_off_command_output
  - transient_open_loop
  - temporary_branch_or_worktree_state
  - unverified_model_suggestion
  - runtime_completion_message

personal_memory_contract_candidates:
  - MemoryEvidenceRef
  - PersonalMemoryCandidate
  - PersonalMemoryRecord
  - MemorySupportLink
  - MemoryCorrection
  - MemorySupersession
  - MemoryPromotionProposal
  - MemoryProjectionManifest
  - MemoryContextPack

memory_record_minimum_semantics:
  identity:
    - memory_id
    - owner_scope
    - memory_kind
  content:
    - statement
    - applicability
    - validity
  support:
    - evidence_refs
    - source_anchors
    - provenance
  governance:
    - confidence
    - verification_status
    - acceptance_status
    - sensitivity
    - freshness
    - conflict_refs
    - supersedes
    - retention
  chronology:
    - created_at
    - effective_from
    - effective_to
    - reviewed_at

ai_core_to_memory_intake:
  uses_existing_contract: OMOS RawEvidenceEnvelope
  new_runtime_contract_required: false
  allowed_source_kinds:
    - AI_CORE_MEMORY_LOG_ENTRY
    - AI_CORE_WORK_RECEIPT_REF
    - AI_CORE_ACCEPTED_RESULT_REF
    - AI_CORE_TASK_CARD_REF
    - GIT_COMMIT_REF
    - HANDOFF_OR_DECISION_REF
    - FOUNDER_MANUAL_NOTE
    - USER_CORRECTION
  required_fields:
    - source_identity
    - source_version_or_digest
    - occurred_at
    - observed_at
    - scope
    - sensitivity
    - payload_or_artifact_ref
    - provenance
  optional_fields:
    - work_state_ref
    - verification_receipt_ref
    - acceptance_receipt_ref
  invariants:
    - Work state remains AI Core authority
    - Runtime event remains runtime or AI Core evidence
    - Memory team never closes AI Core work
    - Memory capture never implies memory acceptance

founder_vault_projection:
  folders:
    - identity
    - context
    - memory
    - sop
    - operations
    - projects
    - people
    - archive
  memory_summary:
    role: STARTUP_CONTEXT_PROJECTION
    rebuildable: true
    source_refs_required: true
    direct_model_overwrite_is_canonical: false
  folder_taxonomy_is_schema_authority: false
  mixed_scope_global_summary_forbidden: true

recall_context_pack:
  inputs:
    - task_or_query_intent
    - requester_scope
    - context_budget
  outputs:
    - selected_memory_refs
    - source_refs
    - freshness
    - applicability
    - omission_or_gap_notice
  permission_strategy: INTERSECTION
  unrestricted_global_summary_forbidden: true

loops:
  Capture:
    owner: Personal Memory Team
  Consolidate:
    owner: Personal Memory Team
  GovernPromote:
    owner: Personal Memory Team with existing OMOS governance semantics
  RecallCorrect:
    owner: Personal Memory Team
  WorkCloseout:
    owner: AI Core
    memory_role: upstream signal only

backlog:
  PMEM_00:
    title: AI Core Memory Surface and Authority Audit
    status: READY_FOR_READ_ONLY_DESIGN
    writes_allowed: false
  PMEM_01:
    title: Personal Memory Contract v0.1
    status: BLOCKED_BY_PMEM_00
  PMEM_02:
    title: Legacy Memory Translation Mapping
    status: BLOCKED_BY_PMEM_00_PMEM_01
  PMEM_03:
    title: Founder Vault Projection Contract
    status: BLOCKED_BY_PMEM_01
  PMEM_04:
    title: Recall and Context Pack Contract
    status: BLOCKED_BY_PMEM_01
  PMEM_05:
    title: Minimal Read-only Capture Adapter
    status: BLOCKED_BY_PMEM_01_PMEM_02
  PMEM_06:
    title: Personal-to-Team/Company Promotion Proposal
    status: DEFER_UNTIL_PERSONAL_MEMORY_STABLE
  PMEM_07:
    title: Memory Evaluation and Regression
    status: BLOCKED_BY_PMEM_01_PMEM_04

superseded_or_removed_from_memory_backlog:
  task_card_frontmatter_profile: AI_CORE_OWNED_OUT_OF_SCOPE
  execution_request_receipt_platform: AI_CORE_OR_RUNTIME_OWNED_OUT_OF_SCOPE
  runtime_native_event_mapping_platform: OUT_OF_SCOPE
  codex_runtime_baseline: OUT_OF_SCOPE
  hermes_adapter: OUT_OF_SCOPE
  deepseek_harness_adapter: OUT_OF_SCOPE
  universal_provider_interface: REJECTED
  memctl_write_commands: REJECTED
  memctl_read_only_view: OPTIONAL_DEFERRED

authority_invariants:
  - AI_CORE_REMAINS_COMPLETE
  - PERSONAL_MEMORY_HARNESS_NE_AI_CORE_REPLACEMENT
  - WORK_RECORD_NE_MEMORY
  - WORK_STATE_NE_MEMORY_STATE
  - RUNTIME_COMPLETE_NE_MEMORY_VERIFIED
  - CAPTURED_NE_ACCEPTED_MEMORY
  - PERSONAL_MEMORY_NE_COMPANY_CANONICAL_KNOWLEDGE
  - FOUNDER_VAULT_TAXONOMY_NE_CANONICAL_SCHEMA
  - MEMORY_SUMMARY_IS_REBUILDABLE_PROJECTION
  - USER_CORRECTION_CREATES_EVIDENCE_NOT_DIRECT_OVERWRITE
  - NO_RUNTIME_PROVIDER_PLATFORM_IN_MEMORY_SLICE
  - NO_AUTOMATIC_SCOPE_PROMOTION

required_negative_fixtures:
  - runtime says done but memory verification is NOT_RUN
  - current task status incorrectly promoted as long-lived memory
  - same fact changes over time without supersession
  - founder vault summary loses source references
  - legacy file named canonical is treated as current authority without audit
  - personal preference leaks into company scope
  - private person context appears in mixed-scope global summary
  - model confidence auto-promotes memory
  - deleted source leaves stale founder-vault projection
  - user correction overwrites history instead of creating revision
  - memory team mutates AI Core task status
  - runtime adapter work enters the memory backlog
