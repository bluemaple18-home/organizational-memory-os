  answers: what happened in this work
  does_not_answer: what should be remembered long term
  may_generate_candidates: '0..N'

historical_comparison:
  slice_of: SSP-323（EMEM-09）切片 1
  purpose: >-
    Classify how a submission compares to prior history for the same
    identity, and derive whether a resend/update is warranted. This is a
    comparison RESULT, not a second candidate lifecycle: it does not read or
    set candidate_status, record_status, verification_status or
    acceptance_status, and every disposition still passes through the
    existing PersonalMemoryCandidate lifecycle and acceptance gate
    unchanged. SSP-324's dedup/resend rule binds to the dispositions
    declared here rather than restating them.
  categories:
    - UNSEEN
    - UNCHANGED
    - NEW_EVIDENCE
    - MATERIALLY_CHANGED
    - CONTRADICTED
  dispositions:
    UNSEEN: INITIAL_SUBMISSION
    UNCHANGED: NO_RESEND
    NEW_EVIDENCE_WITHOUT_MATERIAL_EFFECT: LOCAL_RECURRENCE_ONLY
    NEW_EVIDENCE_WITH_MATERIAL_EFFECT: EVIDENCE_UPDATE_REVISION
    MATERIALLY_CHANGED: CORRECTION_SUPERSESSION_PROPOSAL
    CONTRADICTED: CORRECTION_CONFLICT_PROPOSAL
  material_effect_dimensions:
    - evidence_strength_tier
    - applicability
    - risk
    - conflict_determination
    - redaction_or_sensitivity_requirement
    - conclusion
  category_and_disposition_derivation: >-
    category and disposition are NEVER caller-declared -- both are computed
    by the evaluator from primitive signals, so a caller cannot assert an
    arbitrary classification and have it trusted. This directly answers a
    review finding against an earlier design in this repository (SSP-294)
    where a caller-declared classification was checked only for internal
    self-consistency, not against the facts it claimed to summarize.

    Precedence, highest first (a submission can trigger more than one
    signal at once -- e.g. new evidence that also contradicts a prior
    conclusion -- so an explicit order is required, not just five
    mutually-assumed-exclusive names):

      1. no_prior_record            -> UNSEEN
      2. contradicts_prior          -> CONTRADICTED
      3. has_new_evidence           -> NEW_EVIDENCE
                                        (material_effect then selects which
                                        of the two NEW_EVIDENCE dispositions)
      4. material_effect            -> MATERIALLY_CHANGED
                                        (material effect with no new
                                        evidence: the same material was
                                        re-examined and the conclusion no
                                        longer holds, distinct from new
                                        evidence arriving)
      5. identical_to_prior         -> UNCHANGED

    no_prior_record, identical_to_prior and has_new_evidence are
    machine-checkable and computed directly from the submitted prior/current
    identity, content hash and evidence_refs -- never read from a
    caller-declared boolean. material_effect and contradicts_prior require
    semantic judgment this evaluator cannot perform; the caller supplies
    them, but a bare boolean is not accepted on its own -- each true value
    must carry non-empty reasons naming which material_effect_dimensions
    changed, and at least one evidence_ref. A caller cannot claim
    material_effect or contradicts_prior when no_prior_record is true --
    there is nothing prior to differ from or contradict.

organizational_value_assessment:
  slice_of: SSP-323（EMEM-09）切片 2
  purpose: >-
    Assess how much organizational value an already-surfaced personal
    observation/pattern might carry, and -- separately -- whether an
    employee genuinely cannot resolve an open question themselves while it
    still carries enough value to flag for organizational follow-up.
    Organizational Value Assessment != Promotion Eligibility: this
    evaluator never reads or writes candidate_status, record_status,
    verification_status, acceptance_status or conflict_resolution_status,
    and a HIGH assessment here does not itself authorize promotion --
    SSP-294's existing gate, policy matrix and scope ceiling still apply
    unchanged to whatever eventually gets proposed. NEEDS_ORG_FOLLOWUP !=
    Company Knowledge: it is a follow-up signal carried through SSP-324's
    Minimal Evidence Package, not a canonical record, and creates no
    candidate/record identity by itself.
  dimensions:
    - repeatability
    - impact_scope
    - reusability
    - cost_of_not_knowing
    - decision_rationale_value
    - scarcity
    - stability
    - evidence_strength
    - sensitivity_or_permission_constraint
  rating_levels:
    - LOW
    - MEDIUM
    - HIGH
  no_single_score: >-
    The card requires readable per-dimension reasons, not a false-precision
    single score. This evaluator structurally forbids any aggregate numeric
    field (overall_score, value_score, total_score, score,
    aggregate_score) on the run -- there is no computed or caller-declared
    single number anywhere in this contract.
  rating_derivation_and_substantiation: >-
    Unlike historical_comparison's identity/hash/evidence-set signals,
    none of these nine dimensions are computable from raw facts -- they
    are inherently a human judgment call about value, so there is no
    machine-derived rating for this evaluator to compute. The machine
    boundary this evaluator enforces instead is completeness and
    substantiation, not derivation: every dimension in `dimensions` must
    appear in dimension_ratings (an assessment run may not silently omit
    an unfavourable axis or cherry-pick only favourable ones), and every
    dimension -- regardless of level -- requires non-empty reasons in
    dimension_reasons: the card requires readable reasons for the
    assessment as a whole, not only for the consequential HIGH claims.
    A HIGH rating carries one further requirement on top of that: at least
    one evidence_ref in dimension_evidence_refs for that dimension, because
    it is the one claim that can make an item eligible for
    needs_org_followup and this evaluator refuses to trust it on reasons
    text alone. LOW/MEDIUM ratings carry no evidence_ref requirement.
  needs_org_followup:
    purpose: >-
      needs_org_followup is never caller-declared -- like category and
      disposition in historical_comparison, it is computed by the
      evaluator from primitive signals, so a caller cannot silently
      suppress a follow-up that the submitted signals otherwise warrant by
      simply asserting a favourable boolean. A run carrying a
      needs_org_followup field at all is rejected outright.
    derivation: >-
      True exactly when (the employee genuinely could not answer, i.e.
      answer_provided is false) OR (missing_external_evidence is true),
      AND at least one dimension in dimension_ratings is HIGH with its
      substantiation (reasons + evidence_ref) present -- reusing the same
      substantiation rule this evaluator already enforces for any HIGH
      rating rather than a second, separately-trusted org-value flag. The
      "or" is load-bearing: the card's wording is "the employee genuinely
      cannot answer, OR the external evidence is missing" -- either
      condition alone is sufficient, they are not both required.
    consistency: >-
      answer_provided is cross-checked against unresolved_question for
      internal consistency (answered-with-a-lingering-question and
      unanswered-with-no-named-question are both self-contradictory and
      rejected) rather than trusted as an unrelated bare flag.
    suggested_expert: >-
      Optional hint only; null is legal and does not weaken the follow-up.
      Expert routing, taxonomy and cross-person conflict resolution stay
      in the Organizational Layer (SSP-324), not here.

weekly_review_cycle:
  slice_of: SSP-323（EMEM-09）切片 4
  purpose: >-
    Wire slices 1-3 into an actually executable Weekly Grill closeout
    loop. review_period_id is the core identity: every closeout attempt
    for the same scheduled period -- whether it runs on time, as a
    catch-up on the next business day, or as a retry after a failure --
    must carry the SAME review_period_id, so duplicate-closeout or
    duplicate-promotion cannot be produced by re-deriving identity from
    whichever day the work actually happened on.
  binds_to:
    - historical_comparison.categories（item disposition 的機器可查分類
      詞彙，直接讀取，不重述——這同時是「不讓固定問卷冒充 dynamic
      grill」的機器邊界：本片自己完全不新造分類詞彙）
    - organizational_value_assessment（NEEDS_ORG_FOLLOWUP 是
      item_dispositions 唯一額外允許的分類，來自切片 2 的推導結果）
    - runtime_policy.local_first_export_surface（closeout receipt 正是
      該封閉列舉的第二項）
    - personal_memory_resource_contracts.resources.PersonalMemoryCandidate
      （item_dispositions 只能引用既有 candidate 生命週期，不自建一套）
  cadence_policy:
    default_anchor: FRIDAY_AFTERNOON
    anchor_is_tenant_configurable: true
    anchor_change_forbidden_from_altering: closeout_statuses / attempt_kinds / closeout_receipt schema
    catch_up_rule: >-
      A missed scheduled review period rolls forward to the next business
      day. The catch-up attempt keeps the ORIGINAL review_period_id and
      the original scheduled_review_period_start -- it never becomes part
      of the following period's closeout, and the following period's new
      evidence is never mixed into this period's review.
    skipped_requires_exhausted_catch_up: >-
      SKIPPED is a final, explicit disposition. A period that is merely
      awaiting its catch-up window is not SKIPPED -- asserting SKIPPED
      before the catch-up deadline has passed is rejected outright, not
      merely discouraged.
  closeout_statuses:
    - COMPLETE
    - FAILED
    - SKIPPED
    - NO_PROMOTION
  terminal_statuses:
    - COMPLETE
    - SKIPPED
    - NO_PROMOTION
  attempt_kinds:
    - SCHEDULED
    - CATCH_UP
    - RETRY
  closeout_receipt:
    required_fields:
      - review_period_id
      - scheduled_review_period_start
      - scheduled_anchor_at
      - actual_closeout_at
      - attempt_kind
      - final_status
      - catch_up_deadline_passed
      - selected_item_refs
      - item_dispositions
    forbidden_fields:
      - full_personal_store_ref
      - weekly_work_summary
      - personal_store_snapshot
      - candidate_status
      - record_status
      - verification_status
      - acceptance_status
      - conflict_resolution_status
    forbidden_fields_note: >-
      The last five reuse historical_comparison's FORBIDDEN_LIFECYCLE_
      FIELDS: the receipt itself must never carry bulk lifecycle state
      any more than a single comparison run may -- a closeout is a
      lightweight pointer record (selected_item_refs / item_dispositions
      are bounded refs and enum categories, never inline content), never
      a second WeeklyReviewBundle resource with its own record identity,
      and batch confirmation therefore cannot itself accept anything: the
      only acceptance authority remains each PersonalMemoryCandidate's own
      existing verification/acceptance gate.
  item_disposition_rule: >-
    selected_item_refs and item_dispositions must have identical key
    sets -- every selected item reaches a disposition in the same review
    session it was selected in; NEEDS_ORG_FOLLOWUP (the disposition
    supplied by organizational_value_assessment) is the only legal way to
    defer an item without answering it, not silent carry-over to next
    week. An item_dispositions entry whose category is NEEDS_ORG_FOLLOWUP
    must not carry record_ref or promotion_ref -- it stays a follow-up
    signal, never a Knowledge or Canonical creation.
  promotion_idempotency_rule: >-
    When the same item appears with a promotion_idempotency_key across
    more than one closeout attempt for the same review_period_id (a
    retry re-touching the same item), that key must be identical every
    time. A retry that produced a DIFFERENT key for the same item is
    indistinguishable from a retry that created a second, duplicate
    promotion -- the identity that downstream Promotion idempotency
    relies on would have silently drifted.

minimal_evidence_package:
  slice_of: SSP-324（EMEM-10）切片 A
  purpose: >-
    The Personal -> Company transmission envelope, and the ONLY way company
    side ever obtains personal material. This is a payload boundary, not a
    second Promotion design: SSP-294's widening gate, actor x material
    policy matrix and source ACL ceiling still decide whether anything may
    be promoted, and Verification / Review / Acceptance / Canonical Single
    Writer are unchanged. Evidence Package != Company Knowledge.
  binds_to:
    - ownership_visibility_contract.mode_definitions（scope_mode 對應的
      ownership_mode／visibility_scope／consent 要求，全部從上游讀，
      package 只是宣告自己屬於哪個 mode，數值必須對得上）
    - personal_memory_resource_contracts...id_templates.PersonalMemoryCandidate
      （candidate_ref 必須真的是 Candidate identity）
    - runtime_policy.local_first_export_surface（本區塊正是該封閉列舉裡
      minimal_evidence_package 這一項的實際 enforcement；切片 3 review
      留下的 P2「宣稱比 enforcement 大」由此收斂）
  access_boundary:
    allowed_request_kinds:
      - PACKAGE_LOOKUP
    forbidden_request_kinds:
      - BROWSE
      - SEARCH
      - PULL
      - REMOTE_QUERY
      - REMOTE_MOUNT
    allowed_request_fields:
      - request_kind
      - package_ref
    rule: >-
      Company side may only ask for one already-submitted package by its
      exact package_ref. There is no query, filter, scope or wildcard
      field in the request vocabulary at all -- an open browse/search/pull
      is not "denied by policy", it is structurally unrepresentable, which
      is what "no reverse local connector / search API" has to mean if it
      is to be more than a sentence. A request naming a package_ref that
      is not the package actually being transmitted is also rejected, so a
      bounded lookup cannot be used to fetch something else.
  package_identity:
    id_template: "urn:omos:personal-memory:evidence-package:{uuidv7}"
    rule: >-
      slice C repair-01: package_id was previously accepted as any generic
      omos URN, while slice C assumed every package could be recognised by
      a fixed prefix. The two ranges did not match, so a package whose
      package_id was a legal-but-differently-shaped omos URN passed slice
      A yet was invisible to slice C's retrieval exclusion. The identity
      spec now lives here, once, and both the admission check (slice A)
      and the exclusion check (slice C) read it -- same template, same
      {uuidv7} identity shape the rest of this contract already uses.

      This deliberately NARROWS what slice A accepts for package_id. It is
      a listed, limited change to an accepted slice, not a silent one:
      slice A's and slice B's fixtures were re-verified against it, and a
      negative case now proves a generic-but-non-template package_id is
      rejected.
  package_required_fields:
    - package_id
    - tenant_id
    - employee_owner_ref
    - candidate_ref
    - scope_mode
    - ownership_mode
    - visibility_scope
    - sensitivity
    - consent_ref
    - content_snapshot
    - content_hash
    - evidence_refs
    - source_anchor_refs
    - provenance_chain_refs
    - source_acl_snapshot_ref
    - redaction_ref
    - organizational_value_reasons
    - unresolved_question
    - suggested_expert
    - submitted_at
  package_forbidden_fields:
    - full_personal_store_ref
    - personal_store_snapshot
    - weekly_work_summary
    - candidate_status
    - record_status
    - verification_status
    - acceptance_status
    - conflict_resolution_status
  package_closed_shape_rule: >-
    package_required_fields is also the complete allowlist: a package's key
    set must be exactly those fields, no more. repair-01 -- the first
    version only checked "required present" plus a fixed forbidden-name
    list, so renaming the payload (private_blob, extra_context, anything
    not on the ban list) carried whole-store material straight through the
    boundary this slice exists to enforce. A ban list can only ever name
    yesterday's bypass; the allowlist is the actual boundary. The
    forbidden list is kept in front of it so those specific names still
    fail with their own loud code rather than a generic "unknown field".
  ref_binding:
    evidence_refs: EVIDENCE_RECORD
    source_anchor_refs: SOURCE_ANCHOR
    canonical_ref_source: common-vocabulary.identifiers.omos_generated.ref_template + common-vocabulary.resource_kinds
    acl_snapshot_pattern_source: 規格/v0.1/raw-evidence-envelope.schema.json#/properties/access/properties/acl_snapshot_ref
    rule: >-
      repair-01 -- these were originally checked only as "some urn:omos:*
      string", so urn:omos:canonical:secret passed as an evidence ref, a
      source anchor ref and an ACL snapshot ref alike. They are now bound
      to the upstream shapes that actually define them: evidence_refs and
      source_anchor_refs must be canonical refs of exactly the pinned
      resource kind, built from common-vocabulary's own ref_template and
      resource_kinds vocabulary; source_acl_snapshot_ref binds to the same
      STD-01 acl_snapshot_ref pattern permission-retention-deletion.yaml
      already binds to, read from the schema rather than transcribed.
    known_gap: >-
      common-vocabulary declares no PROVENANCE resource kind, so
      provenance_chain_refs can only be bound to "a canonical ref whose
      kind is one of the declared resource_kinds", not to a pinned kind.
      package_id, employee_owner_ref, consent_ref and redaction_ref are
      org-side identifiers (tenant / employee / consent / redaction
      records), not OMOS canonical resources, so they stay at generic
      omos-URN shape. Both are stated here rather than left to look like
      the same strength of binding as the pinned fields.
  content_bound:
    basis: UTF8_BYTES
    max_bytes: 4096
    rule: >-
      repair-01 -- content_snapshot was previously only "a non-blank
      string", so an entire serialized Personal Store was a legal package.
      The snapshot is a bounded excerpt supporting THIS proposal, so it
      carries a declared byte ceiling, measured by the evaluator from the
      value itself rather than from any self-reported size field. The
      number lives here as policy, not in the evaluator.
  content_hash_basis:
    algorithm: SHA256
    serialization: "sha256:<64 lowercase hex>"
    input: content_snapshot UTF-8 bytes, verbatim, no normalization
    rule: >-
      repair-01 -- content_hash was previously only a non-blank string, so
      "not-a-hash" passed and content could be altered while the hash
      stayed put, which is the one thing an integrity field exists to
      prevent. The evaluator now recomputes the digest from
      content_snapshot and requires an exact match, so the basis above is
      normative, not descriptive.
  package_forbidden_fields_note: >-
    The first three are the "whole Personal Store dump" ban; the last five
    are the same FORBIDDEN_LIFECYCLE_FIELDS boundary historical_comparison
    and weekly_review_cycle already enforce -- a package carries bounded
    refs plus one content snapshot, never lifecycle state, because
    verification_status / acceptance_status remain SSP-294's to decide
    after the package arrives, not something the package asserts about
    itself on the way in.
  governance_binding_rule: >-
    A package declares scope_mode (a key of
    ownership_visibility_contract.mode_definitions) and then its
    ownership_mode and visibility_scope must equal exactly what that mode
    declares upstream. They are cross-checked, never trusted as
    independent self-reported values -- a package cannot claim
    EMPLOYEE_PRIVATE while carrying a company-wide visibility_scope.
  consent_rule: >-
    Whether consent is required is read from the upstream mode's
    consent_or_notice_required value, not hardcoded to one mode name: any
    scope_mode whose upstream declaration is CONSENT_REQUIRED must carry a
    non-null consent_ref, and fails closed without one. This keeps
    EMPLOYEE_PRIVATE's "no consent, no upload" rule bound to the single
    place that defines it, and means a future mode that becomes
    consent-requiring is covered without touching this contract.

evidence_package_revision:
  slice_of: SSP-324（EMEM-10）切片 B
  purpose: >-
    Immutable submission / revision semantics and the dedup-resend rule for
    Minimal Evidence Packages. The validation unit is the submission CHAIN
    for one candidate, not a single package: "不得每週因同一知識再次發生就
    往公司重送 duplicate package" and "previous package 必須可追溯" are only
    visible across submissions -- the same lesson weekly_review_cycle
    learned about closeout histories.
  binds_to:
    - historical_comparison.categories / .dispositions（dedup／resend 規則
      的唯一權威。SSP-324 卡片那張表逐條就是這裡的 dispositions，本區塊
      一個字都不抄，評估當下從上游讀）
    - correction_flow.contract.correction_kinds（revision 走既有
      correction／supersession，不建立第二套 revision lifecycle）
    - minimal_evidence_package（切片 A 的封閉封包。本片不重驗封包內部形狀，
      只驗鏈關係——見 layering_boundary）
  layering_boundary: >-
    Slice A owns package-internal shape (its package_required_fields is a
    closed allowlist); slice B owns the relationships BETWEEN packages.
    B therefore wraps A's package in an envelope rather than adding fields
    to it -- adding revision fields into the package would have forced
    reopening an accepted closed shape. B still value-shape-locks the three
    package fields it actually reads (package_id / candidate_ref /
    content_hash) instead of trusting them, but it does not re-implement
    A's validation.

    repair-01: the first version claimed this layering but did not enforce
    it -- a B submission carrying a 3-of-20-field package, or one with an
    extra field, passed, because "both validators run under the same
    aggregator" is not composition: the aggregator merely runs two fixture
    sets. B now calls the SAME package evaluator A calls, extracted to
    scripts/lib/minimal_evidence_package_shape.rb from A with
    byte-identical behaviour, so a package embedded in a submission is held
    to the whole slice A contract. Neutralising one guard inside that
    shared evaluator turns BOTH slices red -- the machine proof that the
    two are one implementation, not two that happen to agree.
  package_evaluator_shared_with: scripts/lib/minimal_evidence_package_shape.rb
  submission_allowed_fields:
    - submission_id
    - supersedes_package_ref
    - comparison
    - correction_proposal_ref
    - correction_kind
    - package
  forbidden_self_declared_fields:
    - comparison_category
    - disposition
  classification_provenance: >-
    repair-02: the first two versions let the submission DECLARE
    comparison_category and disposition, and only checked the pair was a
    legal one. That is vocabulary binding, not result binding -- a caller
    could keep content_hash, evidence_refs, redaction_ref and sensitivity
    all identical to the predecessor, self-report MATERIALLY_CHANGED plus
    a well-formed CORRECTION_SUPERSESSION_PROPOSAL, and send a revision
    having demonstrated no material effect whatsoever, straight through
    the parent card's Acceptance #7.

    historical_comparison already states that category and disposition are
    NEVER caller-declared. So a submission now carries `comparison` -- the
    primitive signals that contract consumes (prior/current identity,
    content hashes, evidence_refs sets, and the substantiated
    material_effect / contradicts_prior judgments) -- and this contract
    derives category and disposition by calling the SAME evaluator slice 1
    calls (scripts/lib/historical_comparison_derivation.rb). Declaring
    comparison_category or disposition on a submission is rejected
    outright.
  comparison_chain_binding: >-
    The primitives must describe the actual chain, or they would simply be
    fabricable one level up: comparison.current_content_hash must equal the
    submission's own package content_hash, and for any later submission
    comparison.prior_content_hash must equal the predecessor package's
    content_hash. The first submission must have no prior record and later
    ones must have one, matching the chain's own shape.
  non_transmittable_dispositions:
    - NO_RESEND
    - LOCAL_RECURRENCE_ONLY
  non_transmittable_rule: >-
    This is the one genuinely NEW decision in this block, so it is declared
    here rather than read from upstream -- but each listed value must exist
    in historical_comparison.dispositions, asserted at evaluation time, so
    it cannot drift away from the vocabulary it selects from. A comparison
    whose disposition is one of these authorizes no company-bound
    submission at all: UNCHANGED means no resend, and NEW_EVIDENCE without
    material effect stays local recurrence history. A submission carrying
    such a disposition is itself the contradiction -- it was sent.
  correction_required_dispositions:
    - CORRECTION_SUPERSESSION_PROPOSAL
    - CORRECTION_CONFLICT_PROPOSAL
  chain_rules: >-
    The first submission supersedes nothing and must be the UNSEEN /
    INITIAL_SUBMISSION case; every later submission must name a
    predecessor that already appears earlier in the same chain, so the
    history stays traceable. package_id must be unique across the chain and
    no two submissions may name the same predecessor: a duplicate id or a
    forked chain is an in-place overwrite wearing a resubmission costume,
    which correction_flow already forbids as in_place_record_overwrite.
    submission_id must be unique too, or an immutable submission audit has
    ambiguous identity. UNSEEN / INITIAL_SUBMISSION is allowed only as the
    first entry: repair-01 found the original check was one-directional
    (first must be UNSEEN) and so let a second entry declare itself an
    initial submission all over again.

    repair-01 also removed an earlier rule that a revision must change
    content_hash. That rule was wrong: slice A's content_hash covers
    content_snapshot only, while the parent card explicitly allows new
    evidence, redaction, policy, applicability and risk changes to produce
    a revision with the statement text untouched -- it would have rejected
    exactly those legitimate revisions. Whether something may be sent at
    all is decided by the upstream disposition, never by whether a hash
    moved.

company_side_evidence_boundary:
  slice_of: SSP-324（EMEM-10）切片 C
  purpose: >-
    What the company side may and may not do with a Minimal Evidence
    Package once it has arrived, and the boundary that keeps
    NEEDS_ORG_FOLLOWUP from quietly becoming Knowledge. Evidence Package !=
    Company Knowledge; NEEDS_ORG_FOLLOWUP != Company Knowledge.
  binds_to:
    - promotion_flow.required_steps（canonical 只能走完整的 promotion
      路徑，本片不重述那串步驟，直接比對）
    - promotion_flow.direct_copy_to_shared_canonical: forbidden
    - capability_safety_floor.invariants（permission_before_retrieval／
      canonical_single_writer 是既有 floor，本片只確認自己沒有繞過它們）
    - core_invariants.PERSONAL_MEMORY_NE_COMPANY_CANONICAL_KNOWLEDGE
    - recall_context_pack.contract.pack_required_fields（正式 retrieval 的
      欄位詞彙由它定義，本片檢查封包不得出現在那些欄位裡）
  allowed_purposes:
    - PROMOTION_REVIEW_SUPPORT
    - VERIFICATION_SUPPORT
    - AUDIT_DISPUTE_PROVENANCE
  forbidden_purposes:
    - GENERAL_SEARCH_CORPUS
    - RAG_RETRIEVAL_SOURCE
    - COMPANY_CANONICAL_KNOWLEDGE
    - PERSONAL_STORE_REPLICA
  purpose_rule: >-
    Both lists come from the parent card verbatim in intent, and are
    declared here because upstream has no purpose vocabulary to read. The
    evaluator asserts they are disjoint and that the allowed list is a
    closed enum: a purpose outside it is rejected rather than treated as
    "not forbidden". "Not on the ban list" is exactly how slice A's first
    version leaked, so this one is an allowlist from the start.
  handling_forbidden_fields:
    - canonical_record_ref
    - retrieval_corpus_ref
    - rag_index_ref
    - personal_store_replica_ref
  canonical_requires_full_promotion: >-
    A handling record may carry promotion_proposal_ref only for
    PROMOTION_REVIEW_SUPPORT, and when it does it must list
    promotion_steps_completed equal to promotion_flow.required_steps --
    read from upstream at evaluation time, never restated here. That is
    what "the package is not a shortcut into canonical" has to mean
    mechanically: the package supports the review, it does not replace the
    steps. direct_copy_to_shared_canonical stays forbidden upstream and
    this contract adds no exception to it.

    repair-01 boundary, stated plainly: promotion_flow.required_steps is
    the authority on WHICH steps must exist, not evidence that this
    particular promotion actually completed them. Comparing the submitted
    list proves it is complete and in order; it does not prove
    Verification, Review or the Single Writer ran. This layer cannot
    observe that, and the correct response is to say so rather than to
    invent a second ledger to pretend otherwise -- the execution facts
    belong to those steps' own contracts and, ultimately, to SSP-295's
    real-person pilot.
  retrieval_exclusion:
    reads_pack_fields:
      - selected_memories
      - source_refs
    selected_memory_entry_ref_field: memory_ref
    rule: >-
      A formal retrieval pack must not reach an Evidence Package.

      repair-01: the first version read the right FIELD NAMES but the
      wrong DATA SHAPE. recall_context_pack's evaluator reads
      selected_memories as objects -- selected.map { |m| m["memory_ref"] }
      -- while source_refs is a list of bare refs. This contract had
      flattened both and compared elements directly, so a retrieval pack
      in the real shape, selecting the handled package by memory_ref,
      passed both recall's evaluator and this one. Matching a field name
      is not integration; the container and element shape have to match
      too.

      The evaluator therefore locks the shape of what it consumes before
      comparing: selected_memories must be a list of maps each carrying a
      string memory_ref (that entry field name is read from
      recall_context_pack.contract.permission_intersection_entry_fields,
      the same vocabulary recall itself uses), and source_refs must be a
      list of strings. Only then are the referenced identities compared.
    scope_note: >-
      Only these two fields are checked, deliberately.
      permission_decision_covered_memory_refs is authorisation coverage,
      not selected output -- sweeping every *_ref field together would
      conflate "what was actually returned" with "what could have been
      authorised". Those are different obligations and are not merged
      here.
    identity_source: >-
      Which identities count as an Evidence Package is NOT decided here:
      it is read from minimal_evidence_package.package_identity, the same
      template slice A admits packages by. repair-01 removed the local
      prefix this block used to declare, because A accepting a wider range
      than C could recognise was exactly the gap.
  followup_allowed_fields:
    - unresolved_question
    - suggested_expert
  followup_shape_rule: >-
    repair-01: the follow-up object was an open shape -- only three named
    things were rejected on its top level. Two inputs got through: one
    carrying a legal record_ref plus promotion_ref (which
    weekly_review_cycle already forbids for NEEDS_ORG_FOLLOWUP, so this
    contract was contradicting an accepted one), and one hiding a whole
    canonical object inside unresolved_question, which was never
    value-shape checked. Adding more banned names only waits for the next
    rename or the next nesting, so the envelope is now a closed allowlist
    with value shapes: unresolved_question must be a non-blank string and
    suggested_expert a string or null. The explicit canonical and
    lifecycle checks are kept ahead of the allowlist so those names still
    fail with their own loud code.
  needs_org_followup_boundary: >-
    A follow-up carried into the Organizational Layer may name a
    suggested_expert or leave it null -- both legal, and null must not
    weaken it. What it may never do is acquire canonical identity: a
    follow-up record carrying canonical_record_ref, or any of the
    lifecycle fields historical_comparison already forbids, is rejected.
    Expert routing, taxonomy and cross-person conflict resolution remain
    the Organizational Layer's, and are explicitly out of this contract.

personal_memory_governance:
  required_dimensions:
    - source support
    - scope
    - ownership_mode
    - visibility_scope
    - sensitivity
    - consent_or_notice
    - applicability
    - validity
    - freshness
    - confidence
    - conflict
    - correction
    - supersession
    - retention
    - verification
    - acceptance

recall_context_pack:
  input:
    - intent
    - requester_identity
    - requester_scope
    - ownership_mode
    - visibility_scope
    - context_budget
  output:
    - selected_memory_refs
    - source_refs
    - applicability
    - freshness
    - permission_decision_ref
    - omitted_or_gap_notice
    - budget_usage
  permission_strategy: INTERSECTION
  unrestricted_global_personal_memory_search: forbidden
  contract:
    request_required_fields:
      - intent
      - requester_identity
      - requester_scope
      - ownership_mode
      - visibility_scope
      - context_budget
    pack_required_fields:
      - pack_id
      - request_ref
      - permission_decision_ref
      - permission_decision_before_selection
      - permission_decision_covered_memory_refs
      - selected_memories
      - source_refs
      - applicability
      - freshness
      - permission_intersection_refs
      - not_applicable_filtered_count
      - omitted_or_gap_notice
      - budget_usage
    permission_intersection_entry_fields:
      - memory_ref
      - intersection_ref
    forbidden_search_strategies:
      GLOBAL_THEN_PROMPT_GUARD: SEARCH_ALL_THEN_PROMPT_GUARD
      UNRESTRICTED_GLOBAL_SEARCH: UNRESTRICTED_GLOBAL_SEARCH
    permission_ordering:
      decision_before_candidate_set: true
      decision_scope_covers_selected: true
    gap_notice_reasons:
      - STALE_PRESENT
      - NOT_APPLICABLE_FILTERED
      - BUDGET_OMITTED
    gap_notice_required_when:
      - stale memory is present in or filtered from the selection
      - a memory was filtered as not applicable to the intent
      - a memory was omitted because of the context budget
    forbidden:
      - SEARCH_ALL_THEN_PROMPT_GUARD
      - UNRESTRICTED_GLOBAL_SEARCH
      - STALE_WITHOUT_FRESHNESS
      - CROSS_OWNER_WITHOUT_INTERSECTION
    statement: >-
      A MemoryContextPack is the only recall result shape. The permission
      decision is made before the candidate set is formed and its scope must
      cover every selected memory. Stale, not-applicable, and budget-omitted
      memories each require an explicit gap notice. There is no path that
      searches all personal memory and then relies on a prompt to prevent
      leakage.

correction_flow:
  steps:
    - USER_OR_SYSTEM_CORRECTION_EVIDENCE
    - CORRECTION_PROPOSAL
    - VERIFY
    - ACCEPT
    - AMEND_INVALIDATE_OR_SUPERSEDE
  history_erasure: forbidden
  contract:
    correction_kinds:
      AMEND: SUPERSEDED
      INVALIDATE: INVALIDATED
      SUPERSEDE: SUPERSEDED
    proposal_required_fields:
      - proposal_id
      - tenant_id
      - employee_owner_ref
      - target_record_ref
      - correction_kind
      - correction_evidence_refs
      - proposed_by
      - chronology.created_at
    supersession_receipt_required_fields:
      - receipt_id
      - tenant_id
      - employee_owner_ref
      - origin_proposal_ref
      - target_record_ref
      - correction_kind
      - old_record_ref
      - resulting_record_status
      - verification_status
      - chronology.created_at
    gate_enforced_fields:
      - verification_receipt_ref
      - personal_acceptance_ref
    gate:
      verification_status_must_be: PASS
      requires:
        - verification_receipt_ref
        - personal_acceptance_ref
    supersede_requires_new_record_ref: true
    immutable_receipt: true
    forbidden:
      - history_erasure
      - in_place_record_overwrite
      - skip_verification
      - skip_acceptance
      - receipt_mutation
    statement: >-
      A correction is started by correction evidence and a proposal. The
      supersession receipt only takes effect after verification PASS and personal
      acceptance. The old record is never overwritten in place — it moves to the
      lifecycle status mapped from correction_kind, and SUPERSEDE also records a
      distinct new_record_ref. The receipt is immutable and always keeps
      old_record_ref; history is never erased.

promotion_flow:
  source:
    - PersonalMemoryCandidate
    - PersonalMemoryRecord
  target_scopes:
    - TEAM
    - DEPARTMENT
    - COMPANY
    - CLIENT
  required_steps:
    - PromotionProposal
    - permission_and_scope_check
    - ownership_and_visibility_check
    - evidence_support_check
    - redaction
    - verification
    - review
    - canonical_single_writer
  direct_copy_to_shared_canonical: forbidden

projection_views:
  examples:
    - memory-summary
    - identity-view
    - project-memory-view
    - people-context-view
    - procedure-view
    - role-home
  rebuildable: true
  folder_taxonomy_is_schema_authority: false

ai_core_donor_mapping:
  absorb:
    - memory distillation failure cases
    - preference and working-style patterns
    - lesson decision procedure patterns
    - correction supersession provenance patterns
    - bounded recall and context budget
    - founder-vault projection experience
  do_not_make_universal:
    - task card state
    - branch worktree reservation
    - runtime session or thread
    - model or provider routing
    - code review merge deploy state
    - developer workflow canonical rules
    - physical .memory or .founder-vault layout
  product_position: DEVELOPER_ROLE_SOURCE_ADAPTER

runtime_policy:
  per_employee_local_runtime_required: false
  central_or_on_prem_service_allowed: true
  optional_executors:
    - deterministic_worker
    - bounded_model_worker
    - Codex
    - Claude Code
    - Hermes
    - DeepSeek Harness
  executor_authority_over_memory: false
  portable_record_contract:
    slice_of: SSP-323（EMEM-09）切片 3
    purpose: >-
      Make "the AI platform is only an executor, never the Personal Memory
      authority" a machine-checkable claim, not only a sentence. This
      extends the executor_authority_over_memory / optional_executors
      declared above (already enforced by
      ai-work-record-boundary.cross_reference) rather than replacing them
      with a second vocabulary or a second executor list.
    binds_to: personal_memory_resource_contracts.resources
    repair_01_note: >-
      The first version of this block declared its own four-field
      portable_fields list (record_id / content_digest / evidence_refs /
      created_at) instead of binding to the real PersonalMemoryCandidate /
      PersonalMemoryRecord required_fields. A review found this let
      ownership, visibility, ACL, status and the real content drift
      silently across executors -- a caller-supplied content_digest was
      never actually compared against content -- and that the restated
      list collided with PersonalMemoryCandidate's own forbidden
      record_id. This block no longer declares a second core-semantics
      field list: portability for a projection is defined against
      whichever resource kind it declares (PersonalMemoryCandidate or
      PersonalMemoryRecord), read from personal_memory_resource_contracts.
      resources.<kind>.required_fields / .forbidden at evaluation time.
    executor_provenance_fields:
      - executor_ref
      - executor_session_ref
    no_migration_invariant: >-
      executor_provenance_fields live alongside a projection's `resource`
      object, never inside it, and must never intersect with any resource
      kind's required_fields in personal_memory_resource_contracts -- they
      are the only things permitted to differ when the same resource is
      re-projected by a different executor. Every required_field of the
      resource's declared kind must be present (the key itself, not
      merely a non-null value -- some required fields such as
      governance.supersedes are legitimately null) and equal between the
      two projections (URN/array-valued fields compared as sets); any
      field that kind's contract forbids must not appear in either
      projection's resource object. Switching executor therefore requires
      no rewrite of any resource field and no knowledge migration.
  local_first_export_surface:
    - minimal_evidence_package
    - weekly_closeout_receipt

personal_memory_runtime:
  slice_of: EMEM-11 切片 1｜Local Personal Store Runtime
  purpose: >-
    The Personal store is a local, embedded SQLite runtime. This block is the
    machine-checkable contract that runtime must satisfy: what may reach the
    store (surfaces), who may be recorded as reaching it (host binding), how a
    write is allowed to land (policy check -> transaction -> store), and which
    uniqueness/immutability guarantees the schema is obliged to enforce. It is
    deliberately NOT a second authority: every vocabulary it checks against is
    read from an existing block at evaluation time.
  owner_authorization: >-
    Owner authorization for this capability is bounded to: a local embedded
    personal store, a deterministic runtime writer, local host binding, and
    Personal scope only. It grants no Company Canonical authority, no Promotion
    authority, and no Acceptance authority.
  invariants:
    - HOST_BINDING_IS_AN_ADAPTER_NOT_THE_RUNTIME
    - LOCAL_CLI_AND_HOST_MCP_SHARE_THE_SAME_RUNTIME_AUTHORITY
    - NO_REMOTE_PERSONAL_STORE_ACCESS_SURFACE
  binds_to:
    - runtime_policy.optional_executors（supported_hosts_v1 必須是它的子集；
      本片不自建 executor 詞彙）
    - runtime_policy.portable_record_contract.executor_provenance_fields
      （HostSessionBinding 的身分欄位就是這兩欄，直接讀取，不另造
      host / host_session_id 這類第二套身分）
    - weekly_review_cycle.closeout_statuses / .terminal_statuses /
      .attempt_kinds（closeout 唯一性是「從既有 cycle 契約推導出的
      enforcement」，SQLite constraint 不是權威）
    - personal_memory_resource_contracts.shared_constraints.id_templates
      （落地列的 id 形狀，含 UUIDv7 version/variant nibble）
    - correction_flow.contract.forbidden（in_place_record_overwrite /
      history_erasure / receipt_mutation 在 runtime 層的落地）
    - capability_safety_floor.invariants.permission_before_retrieval
      （讀路徑的確定性權限檢查 seam）
  store:
    engine: SQLITE
    journal_mode: WAL
    schema_version_required: true
    migration_receipt_required: true
    genesis_version: "0.0.0"
    schema_version_source: MIGRATION_CHAIN_TAIL
    schema_version_source_note: >-
      The store's declared schema_version is not an independent assertion --
      it must equal the to_version of the last migration receipt in the log.
      A store that claims a version no migration produced is rejected.
  access_surfaces:
    - LOCAL_STDIO_MCP
    - LOCAL_CLI
  forbidden_access_surfaces:
    - HTTP_TUNNEL
    - REMOTE_QUERY
    - REMOTE_MOUNT
    - COMPANY_SIDE_FORWARDING
  access_surface_rule: >-
    access_surfaces is a CLOSED enumeration, not a starting set. Both legal
    surfaces are local and both must reach the store through the same runtime
    authority; an MCP server is an adapter in front of that runtime, never a
    second writer. Any surface outside the enumeration -- including anything in
    forbidden_access_surfaces -- is rejected outright rather than downgraded.
  supported_hosts_v1:
    - Codex
    - Claude Code
  supported_hosts_rule: >-
    supported_hosts_v1 must be a subset of runtime_policy.optional_executors.
    Declaring a host this repository's executor vocabulary does not know is a
    contract error, not a runtime feature.
  host_session_binding:
    executor_identity_fields_ref: runtime_policy.portable_record_contract.executor_provenance_fields
    additional_fields:
      - cwd
      - project_ref
      - effective_scope
    forbidden_fields:
      - host
      - host_session_id
      - session_id
      - client_id
      - agent_id
      - remote_endpoint
    shape_rule: >-
      A HostSessionBinding is a CLOSED shape: exactly the fields named by
      executor_identity_fields_ref, plus any of additional_fields. It carries no
      second identity vocabulary -- binding to a host reuses the executor
      identity the portable record contract already defines, so switching host
      needs no identity migration.
    presence_rule: >-
      LOCAL_STDIO_MCP operations MUST carry a host_session_binding whose
      executor_ref names a supported_hosts_v1 host. LOCAL_CLI operations MUST
      NOT carry one: the CLI is usable without a Host, and a CLI operation that
      claims a host session is fabricating provenance. Neither surface gets
      extra authority from that difference.
  write_path:
    - RUNTIME_POLICY_CHECK
    - RUNTIME_TRANSACTION
    - STORE_WRITE
  read_path:
    - RUNTIME_POLICY_CHECK
    - STORE_READ
  path_rule: >-
    Every operation declares the path it actually took, and it must equal the
    declared path for its kind, in order. direct_sql is forbidden on every
    surface: the CLI does not get a shortcut around the policy/transaction layer
    just because no Host is involved. The RUNTIME_POLICY_CHECK step is the
    deterministic permission seam required by
    capability_safety_floor.invariants.permission_before_retrieval -- a read
    that reaches the store before its policy check is rejected even if the check
    later returns allow.
  transaction_rule: >-
    Every store write happens inside a runtime transaction and only a committed
    transaction may produce a durable row. A write that reports an uncommitted
    or rolled-back transaction yet still lists durable rows is a torn write.
  row_contract:
    resource_contract_ref: personal_memory_resource_contracts.resources
    identity_fields:
      PersonalMemoryCandidate: candidate_id
      PersonalMemoryRecord: record_id
      MemorySupportLink: link_id
      MemoryConflictSet: set_id
    identity_fields_rule: >-
      Each declared identity field must itself appear in that kind's
      required_fields in personal_memory_resource_contracts. This block names
      which required field carries the identity; it does not define a second
      field list.
    body_rule: >-
      A stored row is a Personal Memory resource, not a bare identity. Every
      STORE_WRITE carries a `resource` object that satisfies its kind's
      required_fields and forbidden list, read from
      personal_memory_resource_contracts.resources.<kind> at evaluation time.
      A row with a well-formed id and no body is rejected: an id the store
      accepts but cannot tie to memory content is exactly the contentless row
      Slice 1 is required to make impossible.
    identity_binding_rule: >-
      The row id and the body's identity field must be the same value. A row
      whose id is well-formed but whose body belongs to a different resource
      would let a legal identity carry someone else's content.
  idempotency_rule: >-
    A replayed write carrying an idempotency_key already seen in this store must
    resolve to the SAME row id. A second row id under the same key is a
    duplicate, not a retry.
  revision_rule: >-
    Rows are immutable, and immutability is checked over the WHOLE row, not over
    its id and idempotency key alone. Writing to an existing row id is legal
    only when the row is field-for-field identical to what that id already
    holds -- that exact replay is a no-op and changes no supersession state.
    Anything else written to an existing row id is correction_flow's
    in_place_record_overwrite, including a write that keeps the same id and
    idempotency key but alters, adds, or drops supersedes_ref. A correction is
    instead a NEW revision row that names its predecessor via supersedes_ref,
    and that predecessor must already exist in this store. Deleting or
    rewriting a superseded row is history_erasure. Migration receipts are
    immutable for the same reason (receipt_mutation): re-emitting a
    migration_id with different content is rejected.
  closeout_uniqueness:
    derived_from: weekly_review_cycle
    identity_field: review_period_id
    evaluator_ref: scripts/lib/weekly_closeout_history.rb
    delegation_rule: >-
      The runtime does NOT re-implement closeout checking. It groups its
      CLOSEOUT_COMMIT operations by review_period_id -- each group is, by
      construction, exactly one closeout history in weekly_review_cycle's sense
      -- and hands each group to the shared evaluator that SSP-323 slice 4
      already uses. Terminal uniqueness, the legal status and attempt
      vocabularies, the SKIPPED catch-up rule, item disposition categories and
      promotion identity across retries therefore all arrive from that one
      implementation. A runtime that enumerated its own copy of those
      vocabularies would have replaced the cycle contract instead of enforcing
      it, and a runtime that checked only review_period_id and final_status
      would silently drop the promotion idempotency guarantee the cycle
      contract makes.
    promotion_idempotency_rule_ref: weekly_review_cycle.promotion_idempotency_rule
    promotion_idempotency_note: >-
      This is the guarantee the runtime most needs and is least able to
      re-derive: a retry legitimately reuses the same review_period_id, so the
      only thing distinguishing "the same item, touched again" from "a second,
      duplicate promotion" is that the item's promotion identity did not drift.
      Because the runtime stores the closeout attempts, it is the layer that
      actually holds both attempts and can compare them.

