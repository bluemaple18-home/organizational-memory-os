personal_memory_resource_contracts:
  version: 0.1.0
  shared_constraints:
    tenant_id_required: true
    employee_owner_ref_required: true
    id_profile: UUIDv7_URN
    id_templates:
      PersonalMemoryCandidate: urn:omos:personal-memory:candidate:{uuidv7}
      PersonalMemoryRecord: urn:omos:personal-memory:record:{uuidv7}
      MemorySupportLink: urn:omos:personal-memory:support-link:{uuidv7}
      MemoryConflictSet: urn:omos:personal-memory:conflict-set:{uuidv7}
    candidate_not_record_rule: >-
      A PersonalMemoryCandidate is a durable-memory proposal only; it cannot
      become an accepted PersonalMemoryRecord by status, confidence, or label
      mutation. A separate PersonalMemoryRecord requires a distinct record_id,
      origin_candidate_ref, verification receipt, personal acceptance receipt,
      and support links.
    support_target_rule: >-
      Candidate and Record support must point through MemorySupportLink to exact
      Evidence and SourceAnchor refs. Model summaries, completion messages, and
      confidence scores are routing signals only.
    model_summary_as_support: forbidden
    cross_employee_reference_rule: >-
      Any support or member reference that crosses employee_owner_ref requires
      permission_intersection_ref and must not widen the source ACL.
    transient_memory_rule: >-
      Kinds listed in not_long_lived_memory_by_default must fail closed unless a
      later explicit governance contract reclassifies them with support,
      verification, and personal acceptance.
  enums:
    candidate_status:
      - PROPOSED
      - NEEDS_VERIFICATION
      - VERIFIED
      - ACCEPTANCE_REQUESTED
      - ACCEPTED_FOR_RECORD
      - REJECTED
      - BLOCKED
      - SUPERSEDED
    record_status:
      - ACTIVE
      - SUPERSEDED
      - INVALIDATED
      - ARCHIVED
    verification_status:
      - NOT_RUN
      - PARTIAL
      - PASS
      - FAIL
    acceptance_status:
      - PENDING
      - ACCEPTED
      - REJECTED
      - BLOCKED
    support_relation:
      - SUPPORTS
      - QUALIFIES
      - LIMITS
      - CONTRADICTS
      - DERIVED_FROM
    allowed_anchor_resolution_for_support:
      - EXACT_MATCH
      - RELOCATED
    conflict_resolution_status:
      - UNRESOLVED
      - QUALIFIED_BY_SCOPE
      - QUALIFIED_BY_TIME
      - RESOLVED_BY_REVIEW
      - BLOCKED
  resources:
    PersonalMemoryCandidate:
      purpose: unaccepted durable-memory proposal
      identity_kind: PERSONAL_MEMORY_CANDIDATE
      required_fields:
        - candidate_id
        - tenant_id
        - employee_owner_ref
        - memory_kind
        - content.statement_or_structured_content
        - applicability.scope_mode
        - applicability.applies_to_refs
        - validity_interval.effective_from
        - support_link_refs
        - provenance.generated_from_refs
        - provenance.proposed_by
        - governance.ownership_mode
        - governance.visibility_scope
        - governance.sensitivity
        - governance.acl_ref
        - governance.verification_status
        - governance.acceptance_status
        - chronology.created_at
        - candidate_status
      required_support:
        minimum_support_link_refs: 1
        link_resource: MemorySupportLink
        must_resolve_to:
          - RawEvidenceEnvelope
          - SourceAnchor
      lifecycle:
        initial_status: PROPOSED
        allowed_transitions:
          PROPOSED:
            - NEEDS_VERIFICATION
            - VERIFIED
            - REJECTED
            - BLOCKED
          NEEDS_VERIFICATION:
            - VERIFIED
            - REJECTED
            - BLOCKED
          VERIFIED:
            - ACCEPTANCE_REQUESTED
            - REJECTED
            - BLOCKED
          ACCEPTANCE_REQUESTED:
            - ACCEPTED_FOR_RECORD
            - REJECTED
            - BLOCKED
          ACCEPTED_FOR_RECORD:
            - SUPERSEDED
          BLOCKED:
            - NEEDS_VERIFICATION
            - REJECTED
          REJECTED: []
          SUPERSEDED: []
      acceptance_gate:
        acceptance_status_ACCEPTED_requires:
          - governance.verification_status=PASS
          - governance.verification_receipt_ref
          - governance.personal_acceptance_ref
        creates_record: false
      forbidden:
        - record_id
        - resource_kind=PERSONAL_MEMORY_RECORD
        - model_confidence_only
        - memory_kind in not_long_lived_memory_by_default
    PersonalMemoryRecord:
      purpose: accepted memory inside PERSONAL scope
      identity_kind: PERSONAL_MEMORY_RECORD
      required_fields:
        - record_id
        - tenant_id
        - employee_owner_ref
        - origin_candidate_ref
        - memory_kind
        - content.statement_or_structured_content
        - applicability.scope_mode
        - applicability.applies_to_refs
        - validity_interval.effective_from
        - support_link_refs
        - candidate_snapshot.candidate_status
        - candidate_snapshot.verification_status
        - candidate_snapshot.acceptance_status
        - governance.ownership_mode
        - governance.visibility_scope
        - governance.verification_status
        - governance.acceptance_status
        - governance.verification_receipt_ref
        - governance.personal_acceptance_ref
        - governance.sensitivity
        - governance.acl_ref
        - governance.freshness
        - governance.review_due_at
        - governance.conflict_refs
        - governance.supersedes
        - governance.superseded_by
        - governance.retention_state
        - chronology.created_at
        - chronology.effective_from
        - record_status
      creation_gate:
        required:
          - origin_candidate_ref points to PersonalMemoryCandidate
          - record_id differs from origin_candidate_ref
          - candidate_snapshot.candidate_status=ACCEPTED_FOR_RECORD
          - candidate_snapshot.verification_status=PASS
          - candidate_snapshot.acceptance_status=ACCEPTED
          - governance.verification_status=PASS
          - governance.acceptance_status=ACCEPTED
          - governance.verification_receipt_ref
          - governance.personal_acceptance_ref
          - support_link_refs minimum 1
      lifecycle:
        initial_status: ACTIVE
        allowed_transitions:
          ACTIVE:
            - SUPERSEDED
            - INVALIDATED
            - ARCHIVED
          SUPERSEDED:
            - ARCHIVED
          INVALIDATED:
            - ARCHIVED
          ARCHIVED: []
      update_rule: >-
        Corrections create a new revision or supersession receipt; accepted
        records are not overwritten in place.
      forbidden:
        - memory_kind in not_long_lived_memory_by_default
        - missing evidence support
        - missing personal acceptance
    MemorySupportLink:
      purpose: exact evidence and source-anchor support
      identity_kind: MEMORY_SUPPORT_LINK
      required_fields:
        - link_id
        - tenant_id
        - employee_owner_ref
        - target_ref
        - evidence_ref
        - source_anchor_ref
        - source_anchor_profile
        - relation
        - anchor_resolution
        - provenance.created_by
        - provenance.created_at
      allowed_targets:
        - PersonalMemoryCandidate
        - PersonalMemoryRecord
      required_source_refs:
        - RawEvidenceEnvelope.evidence_ref
        - SourceAnchor.source_anchor_ref
      source_anchor_profile_allowed_from: common-vocabulary.source_anchor_profiles.phase_1
      relation_semantics:
        SUPPORTS: evidence supports the memory statement
        QUALIFIES: evidence limits applicability or validity
        LIMITS: evidence restricts scope, actor, time, or confidence
        CONTRADICTS: evidence contributes to MemoryConflictSet
        DERIVED_FROM: memory was derived from a work record or normalized view
      forbidden:
        - model_summary_only
        - source_anchor_ref missing
        - evidence_ref missing
        - anchor_resolution in MISSING/AMBIGUOUS/NOT_CHECKED
    MemoryConflictSet:
      purpose: contradictory or scope/time-qualified memories
      identity_kind: MEMORY_CONFLICT_SET
      required_fields:
        - set_id
        - tenant_id
        - employee_owner_ref
        - member_memory_refs
        - member_owner_refs
        - conflict_type
        - resolution_status
        - support_link_refs
        - created_at
      member_rules:
        minimum_member_memory_refs: 2
        allowed_members:
          - PersonalMemoryCandidate
          - PersonalMemoryRecord
        member_owner_refs_must_match_resolved_members: true
        cross_employee_member_requires: permission_intersection_ref
      support_rules:
        support_links_target_members_only: true
        required_relation: CONTRADICTS
        support_link_target_resource: MemorySupportLink
      resolution_rule: >-
        ConflictSet records contradiction, qualification, or review state only.
        Review or supersession receipts may resolve the conflict elsewhere, but
        the set does not select a winner or grant write authority by itself.
      forbidden_fields:
        - winner_memory_ref
        - accepted_winner_ref
        - canonical_winner_ref
      forbidden_authority:
        - acceptance
        - canonical_writer
        - winner_selection

