ai_core_donor_mapping:
  absorb:
    - memory distillation failure cases
    - preference and working-style patterns
    - lesson decision procedure patterns
    - correction supersession provenance patterns
    - bounded recall and context budget
    - founder-vault projection experience
  do_not_make_universal:
    - task card state
    - branch worktree reservation
    - runtime session or thread
    - model or provider routing
    - code review merge deploy state
    - developer workflow canonical rules
    - physical .memory or .founder-vault layout
  product_position: DEVELOPER_ROLE_SOURCE_ADAPTER

runtime_policy:
  per_employee_local_runtime_required: false
  central_or_on_prem_service_allowed: true
  optional_executors:
    - deterministic_worker
    - bounded_model_worker
    - Codex
    - Claude Code
    - Hermes
    - DeepSeek Harness
  executor_authority_over_memory: false
  portable_record_contract:
    slice_of: SSP-323（EMEM-09）切片 3
    purpose: >-
      Make "the AI platform is only an executor, never the Personal Memory
      authority" a machine-checkable claim, not only a sentence. This
      extends the executor_authority_over_memory / optional_executors
      declared above (already enforced by
      ai-work-record-boundary.cross_reference) rather than replacing them
      with a second vocabulary or a second executor list.
    binds_to: personal_memory_resource_contracts.resources
    repair_01_note: >-
      The first version of this block declared its own four-field
      portable_fields list (record_id / content_digest / evidence_refs /
      created_at) instead of binding to the real PersonalMemoryCandidate /
      PersonalMemoryRecord required_fields. A review found this let
      ownership, visibility, ACL, status and the real content drift
      silently across executors -- a caller-supplied content_digest was
      never actually compared against content -- and that the restated
      list collided with PersonalMemoryCandidate's own forbidden
      record_id. This block no longer declares a second core-semantics
      field list: portability for a projection is defined against
      whichever resource kind it declares (PersonalMemoryCandidate or
      PersonalMemoryRecord), read from personal_memory_resource_contracts.
      resources.<kind>.required_fields / .forbidden at evaluation time.
    executor_provenance_fields:
      - executor_ref
      - executor_session_ref
    no_migration_invariant: >-
      executor_provenance_fields live alongside a projection's `resource`
      object, never inside it, and must never intersect with any resource
      kind's required_fields in personal_memory_resource_contracts -- they
      are the only things permitted to differ when the same resource is
      re-projected by a different executor. Every required_field of the
      resource's declared kind must be present (the key itself, not
      merely a non-null value -- some required fields such as
      governance.supersedes are legitimately null) and equal between the
      two projections (URN/array-valued fields compared as sets); any
      field that kind's contract forbids must not appear in either
      projection's resource object. Switching executor therefore requires
      no rewrite of any resource field and no knowledge migration.
  local_first_export_surface:
    - minimal_evidence_package
    - weekly_closeout_receipt

