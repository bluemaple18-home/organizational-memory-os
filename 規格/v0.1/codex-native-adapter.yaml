schema:
  schema_id: urn:omos:schema:codex-native-adapter:0.1.0
  version: 0.2.0
  status: DRAFT_REVIEW_REQUIRED
  date: '2026-09-14'
  traces_to:
    - AIWR-09
  builds_on:
    - 規格/v0.1/ai-task-card-record.yaml
    - 規格/v0.1/ai-work-record-hook.yaml

purpose:
  statement: >-
    A thin Codex Native Adapter contract: classify Codex's own native session
    event types (event_msg.payload.type, as emitted by the local Codex CLI /
    app-server) into either a lifecycle_events entry the existing Hook contract
    already accepts, or an explicit non-lifecycle category. It gains no
    acceptance, permission or canonical-writer authority; the core flow runs
    without the Adapter installed; an unrecognised native event type fails
    loud rather than being silently dropped or guessed. It does not re-define
    ai-task-card-record.yaml or ai-work-record-hook.yaml -- it references them.
  no_second_workflow_authority: true

measured_native_vocabulary:
  method: >-
    full-corpus scan of every local Codex session log (~/.codex/sessions/**/*.jsonl)
    on the development machine, not a hand sample. Only the event_msg.payload.type
    field (a controlled discriminator, never free-text content) was read; no
    message content, tool output, or file content was inspected or is stored
    anywhere in this repo.
  sampled_sessions: 818
  observed_event_types:
    task_started: 9529
    task_complete: 9392
    turn_aborted: 104
    thread_goal_updated: 95
    thread_settings_applied: 4001
    item_completed: 60008
    token_count: 41642
    user_message: 18
    agent_message: 18
    agent_reasoning: 2
  rule: >-
    lifecycle_event_map and non_lifecycle_event_types together must equal
    exactly the keys of observed_event_types -- every native event type this
    machine has ever actually emitted must be classified one way or the other.
    A native event type observed but classified in neither is
    CODEX_UNCLASSIFIED_NATIVE_EVENT.

lifecycle_event_map:
  map:
    task_started: start
    task_complete: submit_review
  rule: >-
    each key is a native event_msg.payload.type value; each value must be a
    key of ai-task-card-record.lifecycle_event_to_status, enforced by a
    structural assertion at gate time. A MAPPED mapping_run additionally
    requires native_correlation_ref (see mapping_run.native_correlation_ref_rule) -- see design_note
    POST_MERGE_FIX_02 for why this field is what makes the mapping below
    safe.
  design_note: >-
    SSP307-F-01 (repair-01, 2026-09-14): task_complete was originally mapped
    to complete (-> DONE), but ai-task-card-record.allowed_status_transitions
    has no OPEN -> DONE edge (DONE is only reachable from IN_REVIEW), so the
    real Codex sequence task_started, task_complete translated to start,
    complete and produced HOOK_ILLEGAL_TRANSITION on every single run. Fixed
    at the time by mapping task_complete -> submit_review (OPEN -> IN_REVIEW
    is a real edge) instead.

    POST_MERGE_FIX_01 (2026-09-14, after this card was ACCEPTED_GO and
    merged): discovered while fixing the sibling SSP-308 (Claude Code
    Native Adapter) that Stop -- the hook this Adapter's task_complete
    mapping is directly analogous to -- fires per turn, not once per Work
    Record, and that this makes any single-event-to-submit_review mapping
    unsafe on a second turn (IN_REVIEW -> IN_REVIEW does not exist). This
    raised the question of whether task_started/task_complete have the
    same per-turn shape. The measured_native_vocabulary corpus above (818
    sessions) is a frozen vocabulary snapshot from the original
    implementation, not this round's evidence source. This round ran an
    independent, separately-dated per-session cadence scan against the
    real, already-authorized session corpus as it exists now (830
    sessions -- more than 818 because real time passed and new sessions
    accumulated between the two scans), counting occurrences per
    individual session file (not just the aggregate total used at
    original implementation time): task_started has 2+ occurrences in
    75.2% of the 830 real sessions scanned this round (624/830, max 376
    in one session); task_complete has 2+ occurrences in 73.6% (611/830,
    max 375). This is the ordinary case, not an outlier. The
    original submit_review mapping (like SessionStart -> start /
    Stop -> submit_review in codex-native-adapter's own sibling) assumed
    at-most-once firing per Work Record without verifying it, and the
    verification now shows that assumption was false in the large
    majority of real usage. Per this contract's own no-guessing rule and
    matching the resolution already applied to SSP-308's identical shape
    of problem: lifecycle_event_map was emptied at the time. task_started
    and task_complete moved to non_lifecycle_event_types, and the mapping
    decision was deferred to a runtime-probe-informed follow-up.

    POST_MERGE_FIX_02 (2026-09-14): inspected the real payload of
    task_started / task_complete events in the already-authorized session
    corpus (structural fields only -- turn_id, started_at,
    model_context_window, completed_at, duration_ms; no message content
    was read). Every task_started/task_complete pair for the same turn
    carries the same turn_id, and every turn within a session has a
    distinct turn_id. Cross-checked against
    ai-work-record-hook.yaml.capture_contract.event_envelope_fields, which
    includes native_correlation_ref -- the Hook's batch assembly (de-duplication,
    ordering, the OPEN/IN_REVIEW legality check) is scoped per native_correlation_ref,
    not per host session. The per-turn-cadence problem in POST_MERGE_FIX_01
    was never that task_started -> start / task_complete -> submit_review
    are unsafe mappings -- it was that this Adapter's mapping_run shape had
    no native_correlation_ref field, so nothing told the downstream Hook which native_correlation_ref
    each translated event belonged to, and a caller that (wrongly) used one
    native_correlation_ref per session would see the illegal repeat transition. Adding
    native_correlation_ref (mapping_run.native_correlation_ref_rule) and requiring the caller populate
    it from the native event's own turn_id restores the mapping: each
    turn_id gets its own Hook batch, and task_started/task_complete each
    appear at most once within it. lifecycle_event_map is restored;
    task_started and task_complete move back out of
    non_lifecycle_event_types. .work/CARD-SSP307-LIFECYCLE-MAPPING-BACKLOG-20260914.md
    is superseded by this fix, not still open.

    Codex's native lifecycle has no equivalent of block / unblock -- those
    are AIWR/task-card constructs with no native Codex session event backing
    them, so they are deliberately absent from this map rather than guessed.

non_lifecycle_event_types:
  events:
    - item_completed
    - token_count
    - thread_settings_applied
    - thread_goal_updated
    - user_message
    - agent_message
    - agent_reasoning
    - turn_aborted
  rule: >-
    these are real, frequently-observed native event types that never drive
    a task_card lifecycle transition. Listing them here is what distinguishes
    "known and deliberately excluded" from "unknown" -- an event type must
    appear in exactly one of lifecycle_event_map.keys or
    non_lifecycle_event_types.events, never both, never neither.
  turn_aborted_note: >-
    SSP307-F-02 (repair-01, 2026-09-14): turn_aborted was originally mapped
    to cancel, but Codex's own runtime treats an aborted turn as resumable
    (an Interrupt raises TurnAborted, and a separate RecoverTurn operation
    exists specifically to resume an interrupted turn), while
    ai-task-card-record.cancel -> CANCELLED is terminal with no outgoing
    transition. Mapping turn_aborted -> cancel would permanently close a
    Work Record for a Codex turn that might still resume. Per this
    contract's own no-guessing rule, turn_aborted is reclassified as
    non-lifecycle: it is preserved as runtime evidence, and any AIWR-level
    decision about block vs. cancel is left to a higher layer than this
    Adapter, which grants no lifecycle-transition authority beyond a
    literal, unambiguous native-to-AIWR event correspondence.

authority:
  grants_acceptance: false
  grants_permission: false
  grants_canonical_writer: false
  error_behavior: FAIL_LOUD
  forbidden_run_fields:
    - personal_acceptance_ref
    - verification_receipt_ref
    - accepted_for_record
    - canonical_write_receipt_ref
    - permission_decision_ref

optional_dependency:
  adapter_required: false
  core_flow_without_adapter: SUPPORTED
  rule: >-
    a run that declares adapter_required true or core_flow_blocked_without_adapter
    true is CODEX_ADAPTER_MANDATORY.

no_org_wide_install:
  requires_all_users_install: false
  rule: requires_all_users_install true is CODEX_ORG_WIDE_INSTALL.

mapping_run:
  fields:
    - native_event_type
    - mapped_to
    - adapter_output_ref
    - native_correlation_ref
    - outcome
  outcomes:
    - MAPPED
    - NOT_LIFECYCLE
    - DISABLED
  output_ref_rule: adapter_output_ref is an omos URN string (reference only).
  native_correlation_ref_rule: >-
    POST_MERGE_FIX_02 (2026-09-14) named this field task_ref, which
    collided with ai-work-record-hook.yaml.capture_contract.
    event_envelope_fields.task_ref -- an existing, ACCEPTED_GO field that
    validate_ai_work_record_hook_contract.rb requires to be an OMOS
    task-card URN (urn:omos:task-card:<uuid>), not a raw native turn
    identifier. Big review NO_GO'd that conflation (SPEC_FREEZE FP-1):
    "which turn produced this event" and "which task card does this event
    belong to" are two different identities with no guaranteed
    one-to-one mapping. Renamed to native_correlation_ref per Owner-signed
    FP-1-A: this field is explicitly NOT ai-work-record-hook.yaml's
    task_ref, and this Adapter does not mint, resolve, or validate a
    task-card URN -- that stays entirely out of scope (hard_stops
    forbids registry/FSM/database). On a MAPPED run,
    native_correlation_ref must be a non-blank string, populated by the
    Adapter's caller from the native event's own per-turn identifier
    (turn_id for Codex; see lifecycle_event_map.design_note
    POST_MERGE_FIX_02 for the measured evidence this correlation is real
    and stable per turn). This contract does not itself read or validate
    the raw turn_id value -- it only requires the field be supplied and
    non-blank -- because mapping_run is an abstracted classification
    record, not the raw native event payload. Translating
    native_correlation_ref into the task_ref the Hook actually requires
    is the caller's responsibility, not this Adapter's (see
    ai-work-record-hook.yaml capture_contract.batch_scoping_rule). A
    MAPPED run with a blank or absent native_correlation_ref is
    CODEX_MISSING_NATIVE_CORRELATION_REF.
  rule: >-
    outcome not in outcomes is CODEX_INVALID_OUTCOME; a non-URN
    adapter_output_ref on a MAPPED run is CODEX_OUTPUT_NOT_REF; outcome
    DISABLED while adapter_output_ref is still present is
    CODEX_DISABLED_STILL_MAPPING; outcome NOT_LIFECYCLE while adapter_output_ref
    is present is CODEX_NOT_LIFECYCLE_STILL_MAPPING (a non-lifecycle event
    must never produce a lifecycle output).
  mapping_binding_rule: >-
    on a MAPPED run, run.native_event_type must have exactly one entry in
    lifecycle_event_map and that entry's target must equal run.mapped_to. On
    a NOT_LIFECYCLE run, run.native_event_type must be exactly one entry of
    non_lifecycle_event_types. A native_event_type in neither list is
    CODEX_UNCLASSIFIED_NATIVE_EVENT -- the Adapter never guesses at an event
    type it has not been told about.

runtime_probe:
  purpose: >-
    prove the classification above is not just internally self-consistent
    (a fixture written by the same hand that wrote the map) but actually
    covers every native event type this machine's real Codex sessions have
    produced.
  evidence_source: 規格/v0.1/fixtures/codex-native-adapter-runtime-sample.json
  evidence_source_rule: >-
    a frozen, content-free extract (event type name -> observed count only,
    no message text, no tool output, no file paths beyond the aggregate
    counts) of measured_native_vocabulary.observed_event_types above.
  probe_rule: >-
    every key in the runtime sample's event_type_counts must appear in
    exactly one of lifecycle_event_map or non_lifecycle_event_types. A
    sample key found in neither is CODEX_RUNTIME_SAMPLE_UNCLASSIFIED --
    real observed native behaviour, not synthetic fixtures alone, must pass
    the same classification the contract declares.

disable_and_rollback:
  disable_switch: true
  fallback: CORE_FLOW_DIRECT
  side_effects:
    - name: native_event_subscription
      teardown: unregister the Adapter's native event listener from the host Codex runtime
      failure_state: >-
        still subscribed -> the Adapter keeps classifying while disabled;
        detected by a run emitted with a non-empty adapter_output_ref under
        disabled state (CODEX_DISABLED_STILL_MAPPING).
    - name: classification_cache
      teardown: clear any cached native_event_type -> outcome classification
      failure_state: >-
        stale cache -> a native event type added to non_lifecycle_event_types
        after a contract update is still treated as MAPPED on re-enable;
        remediation is a forced re-classification against the current map.

error_contract:
  CODEX_UNCLASSIFIED_NATIVE_EVENT: codex_native.error.unclassified_native_event
  CODEX_MAPPING_TARGET_MISMATCH: codex_native.error.mapping_target_mismatch
  CODEX_MISSING_NATIVE_CORRELATION_REF: codex_native.error.missing_native_correlation_ref
  CODEX_ADAPTER_MANDATORY: codex_native.error.adapter_mandatory
  CODEX_ORG_WIDE_INSTALL: codex_native.error.org_wide_install
  CODEX_INVALID_OUTCOME: codex_native.error.invalid_outcome
  CODEX_OUTPUT_NOT_REF: codex_native.error.output_not_ref
  CODEX_DISABLED_STILL_MAPPING: codex_native.error.disabled_still_mapping
  CODEX_NOT_LIFECYCLE_STILL_MAPPING: codex_native.error.not_lifecycle_still_mapping
  CODEX_EXCEEDS_AUTHORITY: codex_native.error.exceeds_authority
  CODEX_RUNTIME_SAMPLE_UNCLASSIFIED: codex_native.error.runtime_sample_unclassified
  CODEX_ROLLBACK_MISSING_FIELD: codex_native.error.rollback_missing_field
  CODEX_ROLLBACK_SIDE_EFFECT_UNSPECIFIED: codex_native.error.rollback_side_effect_unspecified
  FAIL_SILENT: codex_native.error.fail_silent

runtime_independence: true

cross_reference:
  task_card_record_spec: 規格/v0.1/ai-task-card-record.yaml
  hook_spec: 規格/v0.1/ai-work-record-hook.yaml
  must_match:
    lifecycle_events_from: ai-task-card-record.lifecycle_event_to_status

hard_stops:
  - no lifecycle_event_map entry without live firing-frequency evidence and
    a native_correlation_ref correlation key that lets the downstream Hook scope its
    batch correctly (POST_MERGE_FIX_02 is why task_started/task_complete
    satisfy this; a future candidate event needs the same evidence bar)
  - no codex runtime / event bus / connector implementation here
  - pure function plus data tables only; no state machine engine
  - do not re-define ai-task-card-record.yaml or ai-work-record-hook.yaml
  - no registry / FSM / database / canonical writer
  - no message content, tool output, or file content read into this repo

required_negative_fixtures:
  - a native event type not in lifecycle_event_map or non_lifecycle_event_types
  - outcome MAPPED with adapter_output_ref not a URN
  - outcome DISABLED with adapter_output_ref still present
  - outcome NOT_LIFECYCLE with adapter_output_ref present
  - outcome not in the declared outcomes enum
  - outcome MAPPED with a native_event_type that has no lifecycle_event_map entry
  - a MAPPED run whose mapped_to does not equal the declared map entry
  - outcome MAPPED with a blank or absent native_correlation_ref
  - a NOT_LIFECYCLE run whose native_event_type is not in non_lifecycle_event_types
  - a run declaring adapter_required true
  - a run declaring requires_all_users_install true
  - a runtime sample event type absent from both classification lists
  - a rollback side effect record missing a required field
  - a rollback side effect record with an unspecified failure_state
  - a run carries a forbidden authority field
  - error but the run still claims success
  - a classification list contains an event type never observed in the runtime sample
