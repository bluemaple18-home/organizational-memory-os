gate_kind: T1 contract slice / targeted re-review

findings_carried_in:
  - id: F-01
    severity: P1
    summary: timeout_seconds was metadata only, never compared against a run time quantity
  - id: F-02
    severity: P1
    summary: mandatory-stop gaps checked only on the last iteration; a mid-run gap could be "cleared" next iteration
  - id: F-03
    severity: P2
    summary: iterations not fail-closed validated for their three fields; a missing remaining_gaps read as "no gaps"
  - id: F-04
    severity: P3
    summary: CLOSED + MAX_ITERATIONS_REACHED may still leave ordinary auto_fixable gaps (spec-definition question)

closure:
  F-01:
    status: CLOSED
    fix: >
      run record carries elapsed_seconds (non-negative integer, part of the
      bounded check); elapsed_seconds > timeout_seconds only passes when the run
      ended outcome FAILED_LOUD + terminal_condition TIMEOUT, else
      LOOP_OVER_TIMEOUT. spec termination gains elapsed_seconds_rule /
      timeout_enforcement_rule.
    fixtures:
      - LOOP_NEG_NO_ELAPSED -> LOOP_UNBOUNDED
      - LOOP_NEG_OVER_TIMEOUT (elapsed 500 > timeout 300, outcome CLOSED) -> LOOP_OVER_TIMEOUT
      - LOOP_POS_TIMEOUT_TERMINATED (elapsed 305 > 300 but FAILED_LOUD + TIMEOUT) -> allow
  F-02:
    status: CLOSED
    fix: >
      mandatory-stop gaps are checked per iteration (each_with_index). The first
      iteration whose remaining_gaps holds a requires_human_decision gap must be
      the last with outcome BLOCKED + blocker_ref; the first with a non-human
      auto_fixable:false gap must be the last with outcome FAILED_LOUD.
    fixtures:
      - LOOP_NEG_HUMAN_GAP_MIDWAY (iter1 human gap, iter2 clears it, outcome BLOCKED) -> LOOP_SKIPPED_HUMAN_DECISION
      - LOOP_NEG_UNFIXABLE_MIDWAY (iter1 unfixable, iter2 clears it, outcome FAILED_LOUD) -> LOOP_UNFIXABLE_NOT_LOUD
  F-03:
    status: CLOSED
    fix: >
      every iteration is fail-closed validated for iteration_fields presence and
      Array-typed filled_fields / remaining_gaps -> LOOP_MALFORMED_ITERATION.
    fixture: LOOP_NEG_MALFORMED_ITERATION (missing remaining_gaps) -> LOOP_MALFORMED_ITERATION
  F-04:
    status: DEFERRED
    note: spec-definition question, reviewer kept as P3 backlog; repair did not change the contract.

findings_new_this_round:
  - id: F-05
    severity: P2
    status: DEFERRED_TO_BACKLOG
    summary: >
      terminal_condition TIMEOUT is not required to have elapsed_seconds >
      timeout_seconds, so a run can declare a premature TIMEOUT close-out. This
      is fail-closed leaning (an unnecessary fail-loud) and does not reintroduce
      the F-01 boundedness bypass; reviewer explicitly did not block GO.
    backlog: 文件/待辦重整.md 規範債 backlog

