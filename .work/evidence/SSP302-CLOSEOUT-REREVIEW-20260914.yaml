lessons:
  - 同一 blocker 連續三輪 NO_GO 觸發全域 hard stop，正確路徑是轉 Owner spec-freeze
    而非繼續猜下一種語法（regex → 逼近開放集合 → 第四種構造仍會打穿；
    改為凍結出口形狀 → 可窮舉 → 才真正收斂）。
  - 簽核後修改任何已簽驗收條款的語意，必須重新取得簽核，即使技術判讀本身正確；
    治理缺口與技術缺口是兩種不同的 finding，不能互相抵銷。

