  F-02:
    status: CLOSED
    fix: >
      HARNESS_SECOND_RUNTIME is fail-closed: run.keys.any? { |k|
      k.start_with?("builds_") && run[k] == true }. spec no_second_runtime adds
      named builds_scheduler / builds_queue (false) and a fail-closed rule;
      EXPECTED_SECOND_RUNTIME_FLAGS now locks 6 flags false structurally.
    fixture: HARNESS_NEG_SECOND_RUNTIME_UNLISTED (builds_scheduler:true) -> HARNESS_SECOND_RUNTIME
  F-03:
    status: CLOSED
    fix: >
      after the step loop, steps.map { step } must equal (1..steps.length).to_a
      else HARNESS_STEP_INDEX_GAP. spec step_failure gains step_index_rule.
