closure:
  F-01:
    status: CLOSED
    fix: >
      hermes_adapter_failure takes a supported_versions argument; callers pass
      EXPECTED_SUPPORTED_VERSIONS (= spec compatibility.supported_hermes_versions,
      structurally asserted). The run's own supported_hermes_versions field is
      never read.
    fixture: HERMES_NEG_SELF_WIDENED_VERSIONS (run self-reports [...,9.9], hermes_version 9.9, MAPPED) -> HERMES_INCOMPAT_NOT_LOUD
  F-02:
    status: CLOSED
    fix: >
      on a MAPPED run, run.hermes_event must have exactly one hermes_event_map
      entry and that entry's mapped_to must equal run.mapped_to, else
      HERMES_MAPPING_NOT_DECLARED. spec mapping_run gains mapping_binding_rule.
    fixture: HERMES_NEG_MAPPING_NOT_DECLARED (table started->start, run started->complete) -> HERMES_MAPPING_NOT_DECLARED
  F-03:
    status: CLOSED
    fix: >
      INCOMPATIBLE_FAIL_LOUD must have present?(error) and ok == false, else
      HERMES_FAKE_FAIL_LOUD.
    fixture: HERMES_NEG_FAKE_FAIL_LOUD (INCOMPATIBLE_FAIL_LOUD, no error, ok true) -> HERMES_FAKE_FAIL_LOUD
  F-04:
    status: CLOSED
    fix: >
      each hermes_event_map entry must carry a non-empty string hermes_event
      unique within the map, else HERMES_EVENT_MAP_MALFORMED.
    fixtures:
      - HERMES_NEG_EVENT_MAP_NO_KEY (entry missing hermes_event) -> HERMES_EVENT_MAP_MALFORMED
      - HERMES_NEG_EVENT_MAP_DUPLICATE (same hermes_event -> start / complete) -> HERMES_EVENT_MAP_MALFORMED

