  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

  &lt;h2 id=&quot;ssp285-title&quot;&gt;SSP-285｜知識 MVP 閉環&lt;/h2&gt;
  &lt;p class=&quot;intro subtle&quot;&gt;人工收錄、人工審核、基本搜尋與版本生命週期。&lt;/p&gt;
  &lt;div class=&quot;ssp-legend text-small&quot; aria-label=&quot;卡片角色圖例&quot;&gt;&lt;span&gt;&lt;b class=&quot;input&quot;&gt;&lt;/b&gt;建置／收錄&lt;/span&gt;&lt;span&gt;&lt;b class=&quot;review&quot;&gt;&lt;/b&gt;驗證／審查&lt;/span&gt;&lt;span&gt;&lt;b class=&quot;official&quot;&gt;&lt;/b&gt;正式知識&lt;/span&gt;&lt;span&gt;&lt;b class=&quot;search&quot;&gt;&lt;/b&gt;基本搜尋&lt;/span&gt;&lt;span&gt;&lt;b class=&quot;lifecycle&quot;&gt;&lt;/b&gt;更新／歷史&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;ssp-map&quot;&gt;&lt;div class=&quot;ssp-main&quot; id=&quot;ssp285-main&quot; aria-label=&quot;SSP-285 主流程；移到或聚焦卡片可查看直接關聯&quot;&gt;
    &lt;svg class=&quot;ssp-lines&quot; aria-hidden=&quot;true&quot;&gt;&lt;defs&gt;&lt;marker id=&quot;ssp285-arrow&quot; markerWidth=&quot;8&quot; markerHeight=&quot;8&quot; refX=&quot;6&quot; refY=&quot;3&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0,0 L0,6 L7,3 z&quot; fill=&quot;currentColor&quot;&gt;&lt;/path&gt;&lt;/marker&gt;&lt;/defs&gt;&lt;g id=&quot;ssp285-line-layer&quot;&gt;&lt;/g&gt;&lt;/svg&gt;
    &lt;button class=&quot;card ssp-node&quot; data-id=&quot;M01&quot; data-role=&quot;input&quot; type=&quot;button&quot;&gt;&lt;span class=&quot;role&quot;&gt;建置&lt;/span&gt;&lt;strong&gt;① 分類／目錄／範本&lt;/strong&gt;&lt;small&gt;統一分類、目錄規則與文件範本&lt;/small&gt;&lt;/button&gt;
    &lt;button class=&quot;card ssp-node&quot; data-id=&quot;M02&quot; data-role=&quot;input&quot; type=&quot;button&quot;&gt;&lt;span class=&quot;role&quot;&gt;人工收錄&lt;/span&gt;&lt;strong&gt;② 文字／Markdown 收錄&lt;/strong&gt;&lt;small&gt;人工建立或更新知識內容&lt;/small&gt;&lt;/button&gt;
    &lt;button class=&quot;card ssp-node&quot; data-id=&quot;M03&quot; data-role=&quot;review&quot; type=&quot;button&quot;&gt;&lt;span class=&quot;role&quot;&gt;驗證&lt;/span&gt;&lt;strong&gt;③ 必要 metadata 驗證&lt;/strong&gt;&lt;small&gt;title、summary、source、status、version、owner、last_reviewed_at&lt;/small&gt;&lt;/button&gt;
    &lt;button class=&quot;card ssp-node&quot; data-id=&quot;M04&quot; data-role=&quot;review&quot; type=&quot;button&quot;&gt;&lt;span class=&quot;role&quot;&gt;狀態&lt;/span&gt;&lt;strong&gt;④ Proposal&lt;/strong&gt;&lt;small&gt;待審草案；不可直接成為正式知識&lt;/small&gt;&lt;/button&gt;
    &lt;button class=&quot;card ssp-node&quot; data-id=&quot;M05&quot; data-role=&quot;review&quot; type=&quot;button&quot;&gt;&lt;span class=&quot;role&quot;&gt;人工審查&lt;/span&gt;&lt;strong&gt;⑤ Review&lt;/strong&gt;&lt;small&gt;確認來源、內容、責任人與版本&lt;/small&gt;&lt;/button&gt;
    &lt;button class=&quot;card ssp-node&quot; data-id=&quot;M06&quot; data-role=&quot;official&quot; type=&quot;button&quot;&gt;&lt;span class=&quot;role&quot;&gt;狀態&lt;/span&gt;&lt;strong&gt;⑥ Approved 正式知識&lt;/strong&gt;&lt;small&gt;目前有效、可被基本搜尋找到的版本&lt;/small&gt;&lt;/button&gt;
    &lt;button class=&quot;card ssp-node&quot; data-id=&quot;M07&quot; data-role=&quot;search&quot; type=&quot;button&quot;&gt;&lt;span class=&quot;role&quot;&gt;基本搜尋&lt;/span&gt;&lt;strong&gt;⑦ 結果／來源／版本／引用&lt;/strong&gt;&lt;small&gt;無可信內容時，明示「找不到」&lt;/small&gt;&lt;/button&gt;
    &lt;button class=&quot;card ssp-node&quot; data-id=&quot;M08&quot; data-role=&quot;lifecycle&quot; type=&quot;button&quot;&gt;&lt;span class=&quot;role&quot;&gt;維護&lt;/span&gt;&lt;strong&gt;⑧ 更新 → Superseded／Archived → 歷史&lt;/strong&gt;&lt;small&gt;新修訂回 Proposal；舊版可追溯&lt;/small&gt;&lt;/button&gt;
  &lt;/div&gt;&lt;/div&gt;
  &lt;section class=&quot;ssp-acceptance&quot; aria-labelledby=&quot;ssp-acceptance-title&quot;&gt;&lt;h3 id=&quot;ssp-acceptance-title&quot;&gt;交付驗收軌&lt;/h3&gt;&lt;ol class=&quot;ssp-rail&quot;&gt;&lt;li&gt;&lt;strong&gt;種子知識&lt;/strong&gt;&lt;small&gt;可被收錄與審核&lt;/small&gt;&lt;/li&gt;&lt;li&gt;&lt;strong&gt;代表性查詢&lt;/strong&gt;&lt;small&gt;可看見來源、版本與引用&lt;/small&gt;&lt;/li&gt;&lt;li&gt;&lt;strong&gt;操作文件&lt;/strong&gt;&lt;small&gt;收錄、審核、搜尋、更新、維護&lt;/small&gt;&lt;/li&gt;&lt;li&gt;&lt;strong&gt;已知限制&lt;/strong&gt;&lt;small&gt;不把缺口偽裝為功能&lt;/small&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/section&gt;
  &lt;section class=&quot;ssp-detail&quot; aria-live=&quot;polite&quot; aria-label=&quot;流程節點詳情&quot;&gt;&lt;div class=&quot;card&quot; id=&quot;ssp285-detail&quot;&gt;&lt;small&gt;互動說明&lt;/small&gt;&lt;h3&gt;移到或聚焦任一卡片&lt;/h3&gt;&lt;p&gt;僅顯示該卡與一跳關聯；點選只更新這裡的說明。&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;

&lt;script&gt;
(() =&gt; {

  }

  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)

    target?.nodeType != null &amp;&amp; trigger.contains(target);

    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;

    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);

  };

    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
